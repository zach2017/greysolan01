{y:"calc",a:600,u:"mL",p:"Chloe, 28|😟|How much have I lost?",s:"Chloe's used pads weigh 850 g. The same pads dry weigh 250 g. What is the estimated blood loss?",r:"850 - 250 = 600 g = 600 mL.",c:["Wet weight","- dry weight","g = mL"],tip:"Weighing beats guessing."},
{y:"sata",n:4,p:"Charge nurse|🧐|Who is at risk tonight?",s:"Which clients are at higher risk for uterine atony? Select all that apply.",o:["Gave birth to twins","Receiving magnesium sulfate","Had a long oxytocin induction","Delivered a 4,600 g baby","First baby after an 8-hour labor","Breastfed in the first hour"],r:"An overstretched or exhausted uterus contracts poorly. Breastfeeding releases oxytocin and helps.",c:["Overdistended or tired muscle","Weak contraction","Bleeding"],tip:"Big, many, long, or medicated."},
{p:"Chloe, 28|😖|The pressure down there is unbearable.",s:"After a catheter drains 650 mL, Chloe's fundus is firm at the midline, but she has severe perineal pressure and her pulse is climbing. What does the nurse do next?",o:["Inspect the perineum for a hematoma","Give another dose of oxytocin","Reassure her that afterpains are expected","Massage the firm fundus again"],r:"Pain out of proportion with a firm fundus and rising pulse means hidden bleeding into tissue.",c:["Vessel injured at birth","Blood collects in tissue","Pain, pressure, hidden blood loss"],tip:"Pain not relieved by medication + firm fundus = hematoma."}]},
{f:4,t:"Uterotonic Medications",e:"💊",med:1,ref:"ATI Maternal Newborn Ch 20 (Postpartum Disorders) · Ricci Ch 22",
kp:["Oxytocin: first choice; diluted in IV fluid or IM","Methylergonovine 0.2 mg IM: NOT with hypertension; check BP first","Carboprost 250 mcg IM: NOT with asthma; causes diarrhea and fever","Misoprostol: given rectally for hemorrhage"],
v:[["🥇","Oxytocin","First line"],["🩺","Methylergonovine","Hypertension = no"],["🫁","Carboprost","Asthma = no"],["🍑","Misoprostol","Rectal"]],
q:[
{p:"Grace, 35|😟|I am still bleeding.",s:"Grace has preeclampsia, BP 162/100, and a boggy uterus. Which prescription should the nurse question?",o:["Methylergonovine 0.2 mg IM","Oxytocin infusion","Misoprostol rectally","Fundal massage"],r:"Methylergonovine constricts blood vessels and can cause a hypertensive crisis or stroke.",c:["Ergot constricts vessels","BP rises further","Stroke, seizure"],tip:"METHergine: no for hyperTension."},
{p:"Ana, 26|😮‍💨|I use an inhaler every day.",s:"Ana has asthma and a postpartum hemorrhage. Which prescription should the nurse question?",o:["Carboprost","Oxytocin","Methylergonovine","Misoprostol"],r:"Carboprost is a prostaglandin that constricts the airways.",c:["Prostaglandin F2-alpha","Bronchial muscle constricts","Bronchospasm"],tip:"Carboprost = no in asthma."},
{y:"calc",a:1,u:"mL",p:"Chloe, 28|😬|Another injection?",s:"Prescribed: carboprost 250 mcg IM. Available: 0.25 mg/mL. How many mL?",r:"250 mcg = 0.25 mg. 0.25 / 0.25 = 1 mL.",c:["mcg to mg","/ concentration","mL"],tip:"Match the units before dividing."},
{y:"matrix",cols:["Hypertension","Bronchospasm and diarrhea","Water intoxication"],rows:[["Carboprost",1],["Methylergonovine",0],["Oxytocin (high dose, long infusion)",2]],p:"Student nurse|🤓|Quiz me.",s:"Match each medication to its key adverse effect.",r:"Each drug's danger matches the condition where it is avoided.",c:["Drug action","Side effect","Contraindication"],tip:"Know one contraindication per drug."}]},
{f:4,t:"Postpartum Infections & Clots",e:"🌡️",ref:"ATI Maternal Newborn Ch 20 & 21 · Ricci Ch 22",
kp:["Endometritis: fever after 24 hours, foul lochia, tender uterus; most common after cesarean","Mastitis: one-sided red, hot, wedge-shaped area with flu-like symptoms; KEEP breastfeeding","Wound: redness, swelling, bruising, drainage, edges apart","DVT: one leg swollen, warm, tender; never massage","Pulmonary embolism: sudden breathlessness and chest pain; raise the head of bed, oxygen"],
v:[["🤱","Mastitis","Keep nursing, finish antibiotics"],["👃","Endometritis","Foul lochia + fever"],["🦵","DVT","One leg, no massage"],["🫁","Embolism","Sudden breathlessness"]],
q:[
{p:"Dee, 34|🤒|I have chills, and my belly is so sore.",s:"Three days after cesarean birth: temp 38.9 C, foul lochia, tender uterus. What does the nurse suspect?",o:["Endometritis","Mastitis","Normal healing with afterpains","Urinary tract infection"],r:"Infection of the uterine lining. Surgery and long labor with ruptured membranes raise the risk.",c:["Bacteria reach the uterine lining","Inflammation","Fever, foul lochia, tenderness"],tip:"Foul lochia = uterus."},
{y:"sata",n:4,p:"Ana, 26|😣|One breast is red and hot.",s:"What should the nurse teach about mastitis? Select all that apply.",o:["Keep breastfeeding or pumping","Finish all the antibiotics","Use warm compresses before feeds","Rest and drink fluids","Stop nursing on that side until cured","Bind the breasts tightly"],r:"Emptying the breast clears the infection. Stopping causes milk stasis and abscess.",c:["Milk stasis","Bacteria multiply","Abscess"],tip:"Mastitis: the milk is safe, keep it moving."},
{p:"Dee, 34|😟|My left calf is swollen and warm.",s:"Which action is contraindicated?",o:["Massaging the calf to ease the ache","Elevating the leg","Measuring calf circumference","Notifying the provider"],r:"Massage can dislodge the clot and send it to the lungs.",c:["Clot dislodged","Travels to the lungs","Pulmonary embolism"],tip:"Never rub a suspected clot."},
{p:"Dee, 34|😨|I suddenly can't catch my breath!",s:"Dee has sudden shortness of breath, chest pain and oxygen saturation of 86%. What is the first action?",o:["Raise the head of the bed and apply oxygen","Obtain a clotting test","Walk her to the chair","Give the scheduled warfarin early"],r:"Airway and breathing first. Then call the rapid response team.",c:["Clot blocks lung artery","Blood cannot pick up oxygen","Hypoxia"],tip:"ABCs: oxygen before orders."}]},
{f:4,t:"Postpartum Mood Disorders",e:"🌧️",ref:"ATI Maternal Newborn Ch 22 (Postpartum Depression) · Ricci Ch 22",
kp:["Blues: tearful in the first days, gone by 2 weeks, still cares for self and baby","Depression: lasts beyond 2 weeks; guilt, no interest in baby, sleep and appetite changes; screen with the Edinburgh scale","Psychosis: hallucinations or delusions about the baby; EMERGENCY, never leave her alone with the infant","Ask directly about thoughts of harming herself or the baby","Use a qualified interpreter for screening"],
v:[["🌦️","Blues","Under 2 weeks, still coping"],["🌧️","Depression","Over 2 weeks, cannot cope"],["⛈️","Psychosis","Voices, delusions: emergency"],["❓","Ask directly","'Are you thinking of harming yourself?'"]],
q:[
{y:"matrix",cols:["Blues","Depression","Psychosis"],rows:[["Tearful on day 4, better by day 10, caring for baby",0],["Week 5: cannot sleep, feels worthless, no interest in baby",1],["Hears voices saying the baby is evil",2]],p:"Three new mothers|😢|I do not feel like myself.",s:"Match each client to the mood disorder.",r:"Timing and ability to function separate blues from depression. Loss of reality defines psychosis.",c:["Hormones drop after birth","Mood shifts","Duration and severity decide"],tip:"Two weeks is the dividing line."},
{p:"Eve, 30|😳|The voices say she is not really my baby.",s:"What is the priority?",o:["Stay with her, keep the infant safe and notify the provider now","Schedule a counselling visit next week","Encourage her to nap with the baby","Give her a handout on baby blues"],r:"Psychosis carries a real risk of infant harm and suicide. Safety first.",c:["Delusions about the infant","Impaired judgment","Risk of harm"],tip:"Psychosis = safety emergency."},
{p:"Nia, 27|😔|My baby would be better off without me.",s:"What is the best response?",o:["Are you thinking about harming yourself?","All new mothers feel that way sometimes.","You have a beautiful baby to live for.","Let's talk about your feeding plan instead."],r:"Asking directly does not plant the idea. It opens the door and is the priority assessment.",c:["Hopeless statement","Possible suicidal thoughts","Direct assessment needed"],tip:"Therapeutic + safety = ask directly."},
{y:"sata",n:4,p:"Amal, 29|🙂|(smiles, speaks little English)",s:"Amal has limited English and is at her postpartum visit. Which actions are appropriate? Select all that apply.",o:["Use a qualified interpreter for screening","Screen with the Edinburgh scale","Ask about her support at home","Speak to her, not to the interpreter","Have her mother-in-law interpret","Skip screening because she is smiling"],r:"Every client is screened. Family interpreters can hide symptoms out of shame or protection.",c:["Language barrier","Symptoms missed","Untreated depression"],tip:"Smiling is not a screening tool."}]},
{f:5,t:"Apgar & Newborn Assessment",e:"👶",ref:"ATI Maternal Newborn Ch 23 (Newborn Assessment) · Ricci Ch 17 & 18",
kp:["Apgar at 1 and 5 minutes: heart rate, breathing, tone, reflex response, color; 0-2 each; 7-10 is good","Heart rate 110-160; respirations 30-60; axillary temp 36.5-37.5 C","Blue hands and feet in the first day are normal; blue lips or trunk are not","Caput crosses suture lines; cephalohematoma does not (and raises jaundice risk)","Heat loss: evaporation (wet), conduction (cold surface), convection (draft), radiation (cold object nearby)","Cold stress burns brown fat: uses oxygen and glucose","First stool and first urine within 24-48 hours"],
v:[["💧","Evaporation","Wet baby: dry them"],["🧊","Conduction","Cold scale: cover it"],["🌬️","Convection","Draft: move the crib"],["🪟","Radiation","Cold window nearby"]],
q:[
{y:"calc",a:7,tol:0,u:"points",p:"Baby Lopez|😮|(1 minute old)",s:"At 1 minute: heart rate 136/min, strong cry, some flexion of limbs, grimace to stimulation, pink body with blue hands and feet. What is the Apgar score?",r:"Heart rate over 100 = 2, good cry = 2, some flexion = 1, grimace = 1, blue extremities = 1. Total 7.",c:["Five signs","0, 1 or 2 each","Total out of 10"],tip:"Blue hands and feet always cost one point."},
{y:"matrix",cols:["Evaporation","Conduction","Convection","Radiation"],rows:[["Wet newborn not dried after birth",0],["Placed on a cold scale",1],["Crib beside an air vent",2],["Bassinet near a cold window",3]],p:"Baby Lopez|🥶|(shivering is not my thing)",s:"Match each situation to the type of heat loss.",r:"Each type has its own fix: dry, cover surfaces, block drafts, move away from cold walls.",c:["Heat lost","Baby burns brown fat","Oxygen and glucose used up"],tip:"Conduction = contact."},
{y:"matrix",cols:["Expected","Report"],rows:[["Blue hands and feet at 2 hours",0],["Respirations 72/min with grunting and flaring",1],["Scalp swelling that crosses suture lines",0],["No stool by 48 hours",1],["Slate-gray patches over the lower back",0],["Axillary temperature 36.0 C",1]],p:"Baby Lopez|🙂|(checking in)",s:"Classify each newborn finding.",r:"Grunting, flaring and fast breathing mean respiratory distress. A cold baby needs warming and a glucose check.",c:["Distress","Baby grunts to keep alveoli open","Fatigue and hypoxia"],tip:"Grunting is never normal."},
{p:"Baby Lopez|🥶|(cold and fussy)",s:"How does cold stress harm a newborn?",o:["Brown fat is burned, using up oxygen and glucose","Shivering generates heat and raises glucose","Skin vessels dilate and raise heat production","Surfactant output rises to warm the lungs"],r:"Newborns cannot shiver. Burning brown fat costs oxygen and glucose, causing hypoxia, hypoglycemia and acidosis.",c:["Cold","Brown fat metabolism","Hypoglycemia and hypoxia"],tip:"Cold baby = check sugar."}]},
{f:5,t:"Newborn Medications",e:"💉",med:1,ref:"ATI Maternal Newborn Ch 24 (Nursing Care of Newborns) · Ricci Ch 18",
kp:["Vitamin K 0.5-1 mg IM in the vastus lateralis soon after birth: the newborn gut has no bacteria to make it","Erythromycin eye ointment: inner to outer corner; prevents eye infection from gonorrhea and chlamydia; do not rinse","Hepatitis B vaccine before discharge with consent","Newborn screening blood test after 24 hours of feeding","Circumcision: petroleum gauze (not with a plastic ring), yellow film is normal healing"],
v:[["🩸","Vitamin K","No gut bacteria = no clotting"],["👁️","Erythromycin","Inner to outer, do not rinse"],["🦵","Site","Vastus lateralis"],["🛡️","Hep B","Before discharge"]],
q:[
{p:"Baby Kim|👶|(30 minutes old)",s:"Why does a newborn need vitamin K?",o:["The newborn gut lacks the bacteria that make vitamin K","The liver is too immature to store iron","Breast milk blocks clotting factors","Maternal antibodies destroy platelets"],r:"Without vitamin K, clotting factors cannot be made and the baby can bleed.",c:["Sterile gut","No vitamin K, low clotting factors","Bleeding"],tip:"Sterile gut = no vitamin K."},
{y:"calc",a:0.25,tol:0.005,u:"mL",p:"Baby Kim|😯|(eyeing the syringe)",s:"Prescribed: vitamin K 0.5 mg IM. Available: 1 mg per 0.5 mL. How many mL?",r:"0.5 mg x (0.5 mL / 1 mg) = 0.25 mL.",c:["Dose","x volume / strength","mL"],tip:"Newborn doses are tiny: recheck the decimal."},
{p:"Baby Kim|😤|(kicking)",s:"Which injection site does the nurse use?",o:["Vastus lateralis","Deltoid","Dorsogluteal","Ventrogluteal"],r:"The thigh is the largest developed muscle in a newborn and is away from major nerves.",c:["Small undeveloped muscles","Thigh is largest","Safe absorption"],tip:"Newborn IM = thigh."},
{y:"sata",n:4,p:"Baby Kim|🙂|(blinking)",s:"Which statements about erythromycin eye ointment are correct? Select all that apply.",o:["Apply from the inner to the outer corner","Place a ribbon in the lower lid sac","It prevents eye infection from gonorrhea and chlamydia","It may be delayed up to an hour for bonding","Flush the eyes with saline right after","It is needed only with a known infection"],r:"All newborns receive it because maternal infection can be silent.",c:["Bacteria in birth canal","Eye infection","Blindness"],tip:"Do not wipe it out."},
{y:"calc",a:12.8,tol:0.05,u:"mg",p:"Baby Ross|🤒|(in the NICU)",s:"Prescribed: gentamicin 4 mg/kg IV every 24 hours. The newborn weighs 3.2 kg. How many mg per dose?",r:"4 x 3.2 = 12.8 mg.",c:["mg/kg","x weight","Dose"],tip:"Weight-based doses: use kilograms."}]},
{f:5,t:"Newborn Feeding",e:"🍼",ref:"ATI Maternal Newborn Ch 25 (Newborn Nutrition) · Ricci Ch 18",
kp:["Breastfeed 8-12 times in 24 hours, on demand","Good latch: wide mouth, most of the areola in, no clicking, no pain","Enough milk: 6-8 wet diapers a day, swallowing heard, content after feeds, birth weight regained by 2 weeks","Sore nipples: check the latch first","Not breastfeeding: snug bra, cold packs, no stimulation","Formula: never microwave, discard leftovers, never prop the bottle","Hunger cues: rooting, hands to mouth; crying is late"],
v:[["💦","6-8 wet diapers","Best proof of intake"],["👄","Latch","Wide mouth, no pain"],["🧊","Not nursing","Snug bra + cold"],["🚫","Formula","No microwave, no propping"]],
q:[
{y:"sata",n:4,p:"Ana, 26|🤔|How do I know she is getting enough?",s:"Which findings show adequate breastfeeding? Select all that apply.",o:["6 to 8 wet diapers a day","Swallowing can be heard","Baby is content after feeds","Back to birth weight by 2 weeks","One wet diaper a day on day 6","Clicking sounds and dimpled cheeks"],r:"Clicking and dimpling mean a poor latch.",c:["Good latch","Milk transfers","Wet diapers and weight gain"],tip:"Count diapers."},
{p:"Ana, 26|😣|My nipples are cracked.",s:"What does the nurse assess first?",o:["The newborn's latch and position","The brand of nursing bra","The mother's fluid intake","Time since the last pumping"],r:"Poor latch is the most common cause of nipple pain.",c:["Shallow latch","Nipple pinched","Pain and cracks"],tip:"Assess before you teach."},
{p:"Bea, 31|😖|My breasts are rock hard, and I am bottle feeding.",s:"What should the nurse teach?",o:["Wear a snug bra and apply cold packs","Pump until the breasts are empty","Stand facing a hot shower","Massage the breasts each hour"],r:"Heat, pumping and massage all tell the body to make more milk.",c:["Stimulation","Prolactin and oxytocin released","More milk"],tip:"Suppress = support and cold, no stimulation."},
{y:"calc",a:19.3,tol:0.3,u:"oz/day",p:"Baby Chen|🍼|(hungry!)",s:"A 3.5 kg newborn needs 110 kcal/kg/day. Formula has 20 kcal/oz. How many ounces per day? Round to the tenth.",r:"3.5 x 110 = 385 kcal. 385 / 20 = 19.25, about 19.3 oz.",c:["kcal/kg x weight","/ kcal per oz","oz per day"],tip:"Standard formula = 20 kcal/oz."}]},
{f:5,t:"Newborn Jaundice",e:"🌞",ref:"ATI Maternal Newborn Ch 27 (Newborn Complications) · Ricci Ch 24",
kp:["Physiologic: appears AFTER 24 hours, peaks about day 3-5","Pathologic: appears in the FIRST 24 hours; blood type incompatibility","Mother type O with baby A or B, or Rh mismatch: direct Coombs on the baby","Spreads head to toe; press the skin to check","Phototherapy: eye shields, diaper only, turn every 2 hours, feed often, watch temperature, no lotions","Very high bilirubin damages the brain: lethargy, high-pitched cry, poor feeding"],
v:[["⏰","First 24 hr","Pathologic: call"],["📆","After 24 hr","Physiologic: watch"],["🕶️","Lights","Eye shields, turn, feed"],["🧠","Kernicterus","Bilirubin in the brain"]],
q:[
{p:"Baby Reed|🟡|(10 hours old, looking yellow)",s:"The nurse sees jaundice at 10 hours of age. How should this be interpreted?",o:["Pathologic; report and expect a bilirubin level","Physiologic; teach that it peaks on day 3","Breast milk jaundice; stop breastfeeding","Normal from bruising; recheck at 2 weeks"],r:"Jaundice in the first 24 hours means red cells are being destroyed faster than normal.",c:["Antibodies destroy red cells","Bilirubin rises quickly","Early jaundice"],tip:"Under 24 hours = pathologic."},
{y:"sata",n:5,p:"Baby Reed|😎|(under the blue lights)",s:"Which actions are correct during phototherapy? Select all that apply.",o:["Cover the eyes with shields","Turn every 2 hours","Feed every 2 to 3 hours","Monitor temperature","Leave only the diaper on","Apply lotion to protect the skin","Limit feedings to reduce stools"],r:"Light changes bilirubin into a form excreted in stool and urine, so intake must be high. Lotions can burn.",c:["Light converts bilirubin","Excreted in stool and urine","Level falls"],tip:"More feeds = more stools = less bilirubin."},
{y:"order",o:["Red blood cells break down","Unconjugated bilirubin is released","The immature liver cannot process it fast enough","Bilirubin deposits in the skin","Very high levels enter the brain"],p:"Student nurse|🤓|Explain the yellow.",s:"Place the steps of newborn jaundice in order.",r:"Newborns have many short-lived red cells and a slow liver.",c:["Red cell breakdown","Liver overwhelmed","Jaundice, then brain injury"],tip:"Indirect (unconjugated) is the dangerous one."},
{p:"Baby Reed|🟡|(mom is O positive, baby is A positive)",s:"Which test does the nurse expect on the newborn?",o:["Direct Coombs test","Indirect Coombs test","Kleihauer-Betke test","Fetal fibronectin"],r:"The direct test looks for maternal antibodies stuck to the baby's red cells.",c:["Anti-A antibodies cross","Coat baby's red cells","Hemolysis"],tip:"Direct = baby. Indirect = mother."}]},
{f:5,t:"High-Risk Newborn",e:"🚨",ref:"ATI Maternal Newborn Ch 27 (Newborn Complications) · Ricci Ch 23 & 24",
kp:["Respiratory distress syndrome: preterm, too little surfactant; grunting, flaring, retractions","Transient fast breathing: retained lung fluid, common after cesarean, clears in days","Hypoglycemia (under 40 mg/dL): jittery, weak cry, poor feeding","Withdrawal: high-pitched cry, tremors, sneezing, yawning, loose stools; swaddle, quiet dim room, small frequent feeds, scoring tool","NO naloxone for the baby of an opioid-dependent mother (seizures)","Sepsis: unstable temperature (often low), lethargy, poor feeding","Necrotizing enterocolitis: swollen belly, bloody stools, feeding residuals; stop feeds"],
v:[["🫧","RDS","No surfactant, alveoli collapse"],["🤧","Withdrawal","Shrill cry, sneezing, tremors"],["🥶","Sepsis","LOW temp, sleepy, will not eat"],["🎈","NEC","Big belly, bloody stool: NPO"]],
q:[
{y:"matrix",cols:["Withdrawal","Hypoglycemia","Respiratory distress","Sepsis"],rows:[["High-pitched cry, tremors, sneezing, yawning",0],["Jittery, weak cry, glucose 32 mg/dL",1],["Grunting, flaring, retractions at 30 weeks",2],["Unstable temperature, lethargy, poor feeding",3]],p:"Four NICU babies|😢|(waiting for you)",s:"Match each set of cues to the problem.",r:"Jitteriness appears in both withdrawal and low glucose, so always check the sugar.",c:["Different causes","Overlapping cues","Unique cue decides"],tip:"Sneezing and yawning point to withdrawal."},
{p:"Baby Doe|😴|(slow to breathe)",s:"The mother is opioid dependent. Which medication is contraindicated for this newborn?",o:["Naloxone","Vitamin K","Erythromycin ointment","Hepatitis B vaccine"],r:"Naloxone strips opioids off receptors and causes sudden severe withdrawal with seizures.",c:["Opioid suddenly blocked","Abrupt withdrawal","Seizures"],tip:"Dependent mom = no naloxone for baby."},
{y:"sata",n:4,p:"Baby Doe|😭|(shrill cry)",s:"Which actions help a newborn in withdrawal? Select all that apply.",o:["Swaddle snugly","Keep the room dim and quiet","Offer small, frequent feedings","Score symptoms with a withdrawal tool","Stimulate often with bright toys","Give large feedings every 6 hours"],r:"The nervous system is over-excited. Less stimulation and frequent calories are the mainstays.",c:["Drug supply stops at birth","Nervous system over-fires","Tremors, crying, poor feeding"],tip:"Low stimulation, high calories."},
{y:"bow",bt:{c:["Necrotizing enterocolitis","Hypoglycemia","Physiologic jaundice"],a:["Stop feedings and notify the provider","Measure abdominal girth and prepare gastric decompression","Increase the formula volume","Give a glycerin suppository"],p:["Abdominal girth and bowel sounds","Stools for blood","Bilirubin level","Head circumference"]},p:"Baby Park|😣|(29-week preemie, tight belly)",s:"Two days after starting feeds: swollen abdomen, bloody stools, milk left in the stomach, unstable temperature. Complete the bowtie.",r:"The preterm bowel is poorly perfused; feeding adds bacteria and the wall dies. Rest the gut.",c:["Immature, poorly perfused bowel","Bacteria invade the wall","Necrosis and perforation"],tip:"Preemie + bloody stool = stop feeds."},
{p:"Baby Park|😮‍💨|(grunting)",s:"What causes respiratory distress syndrome in a preterm newborn?",o:["Too little surfactant, so the alveoli collapse","Lung fluid retained after cesarean birth","Meconium blocking the airways","A hole between the upper heart chambers"],r:"Without surfactant, surface tension collapses the air sacs with every breath out.",c:["Surfactant deficiency","Alveoli collapse","Hypoxia, work of breathing"],tip:"Preterm = surfactant. Cesarean term = fluid. Post-term = meconium."}]},
{f:6,free:1,t:"Safety & Fundamentals",e:"🧯",ref:"ATI-style practice set · Saunders 9th ed. Ch 13 (Safety and Infection Control), Ch 14, Ch 17",
kp:["Fire: RACE = Rescue, Alarm, Contain, Extinguish","Hand washing: hands lower than elbows, at least 20 seconds of friction, turn the faucet off with a clean paper towel","Active tuberculosis: private negative-pressure room, N95 for staff, surgical mask on the client for transport","Feeding tube medications: stop the feeding, give each drug separately, flush with water before, between and after","Enema cramps: lower the bag or slow the flow","Nasal drops: head tilted back, stay there about 5 minutes, dropper never touches the nose"],
v:[["🔥","RACE","Rescue, Alarm, Contain, Extinguish"],["😷","TB","Negative-pressure room + N95"],["💧","Tube meds","One at a time, flush between"],["⬇️","Enema cramps","Lower the bag"]],
q:[
{y:"order",o:["Move clients in danger to safety","Activate the fire alarm","Close doors and windows to contain the fire","Use the extinguisher if the fire is small"],p:"Skills-fair nurse|🧐|Fire drill time!",s:"A nurse is teaching staff about fire emergencies. Place the steps in the order they should be performed.",r:"RACE. Client safety always comes before equipment or the fire itself.",c:["Fire starts","Smoke spreads faster than flames","Rescue first, then alarm"],tip:"Ordered response: write the mnemonic first."},
{p:"New nurse|🙂|Am I washing correctly?",s:"A nurse is preparing to perform hand hygiene with soap and water. Which of the following actions should the nurse take?",o:["Keep the hands lower than the elbows while rinsing","Use the hottest water that can be tolerated","Turn the faucet off with a bare wet hand","Rub the hands together for 5 seconds"],r:"Water should run from the cleaner area (forearms) to the dirtier area (fingertips). Hot water damages skin, and a bare hand on the faucet recontaminates.",c:["Hands above elbows","Dirty water runs up the arms","Recontamination"],tip:"Hand washing: hands down. Surgical scrub: hands up."},
{p:"Mr. Hale, 58|🤒|I keep coughing up blood-streaked sputum.",s:"A nurse is admitting a client who has active tuberculosis. Which of the following room assignments should the nurse make?",o:["A private room with negative-pressure airflow","A private room with positive-pressure airflow","A semi-private room with a client who has pneumonia","A room near the nurses' station with the door open"],r:"TB spreads by tiny airborne droplet nuclei. Negative pressure keeps the air from leaving the room.",c:["Droplet nuclei stay airborne","Negative pressure pulls air inward","Organisms do not reach the hallway"],tip:"Airborne = MTV: Measles, TB, Varicella."},
{p:"Mrs. Ito, 70|😌|(continuous tube feeding running)",s:"A nurse is preparing to give three liquid medications through an NG tube to a client receiving continuous enteral feedings. Which of the following actions should the nurse take?",o:["Flush the tube with water between each medication","Mix the three medications together in one syringe","Add the medications to the feeding bag","Give the medications by pushing hard on the plunger"],r:"Medications can interact and clog the tube. Each is given separately by gravity with a water flush before, between and after.",c:["Drugs mixed together","They react or clump","Clogged tube, altered dose"],tip:"Never add medication to the feeding bag."},
{p:"Mr. Diaz, 66|😣|That is cramping!",s:"A nurse is administering a tap water enema. The client reports abdominal cramping. Which of the following actions should the nurse take?",o:["Lower the height of the solution container","Raise the container to finish faster","Remove the tube and stop the procedure","Tell the client to bear down"],r:"Lowering the bag slows the flow and reduces pressure in the bowel, which eases the cramp.",c:["Fluid enters too fast","Bowel wall stretches","Cramping"],tip:"Least invasive fix first: slow it before you stop it."},
{p:"Ms. Bell, 34|🤧|My nose is completely blocked.",s:"A nurse is administering nasal decongestant drops. Which of the following actions should the nurse take?",o:["Have the client stay with the head tilted back for 5 minutes","Touch the dropper to the inside of the nostril","Ask the client to blow the nose right after the drops","Have the client sit upright with the chin down"],r:"Staying tilted back lets the drops reach the nasal passages. Touching the dropper contaminates the bottle.",c:["Head upright","Drops run out the front","No effect"],tip:"Mouth-breathe during the drops."}]},
{f:6,t:"Emergencies & Fluid Balance",e:"🚑",ref:"ATI-style practice set · Saunders 9th ed. Ch 8, 9, 47, 59, 70",
kp:["Primary survey: Airway with neck stabilized, Breathing, Circulation, Disability, Exposure","Cervical cord injury: breathing failure, neurogenic shock (LOW pressure, SLOW pulse), loss of temperature control","Clear nasal drainage after skull fracture: check for the halo sign or glucose; never suction or pack the nose","Fluid overload: crackles, bounding pulse, neck vein distention, weight gain, high blood pressure","Chronic kidney disease: metabolic acidosis (low pH, low bicarbonate)","Addison's disease: bronze skin, low pressure, low sodium, HIGH potassium, low glucose"],
v:[["🅰️","ABCDE","Airway + neck first"],["🫀","Neurogenic shock","Low BP + SLOW pulse"],["💦","Halo sign","Clear nose drip = spinal fluid?"],["🥉","Addison's","Bronze, low Na, high K"]],
q:[
{y:"order",o:["Open the airway while stabilizing the neck","Assess breathing","Assess circulation and control bleeding","Check level of consciousness and pupils","Remove clothing to look for other injuries"],p:"Mr. Vance, 29|😵|(motor-vehicle crash)",s:"A nurse is conducting a primary survey of a client with life-threatening injuries. Identify the sequence of actions.",r:"ABCDE: Airway (with cervical spine protection), Breathing, Circulation, Disability, Exposure.",c:["No airway","No oxygen in","Everything else fails"],tip:"Trauma airway = jaw thrust, not head tilt."},
{y:"sata",n:4,p:"Mr. Vance, 29|😨|I can't feel my legs.",s:"A nurse is monitoring a client who has a cervical spinal cord injury from a fall. For which complications should the nurse monitor? Select all that apply.",o:["Low blood pressure","Slow heart rate","Shallow breathing and weak cough","Poor temperature control","Bounding pulse with high blood pressure in the first hour","Increased urine output"],r:"The injury cuts off sympathetic signals: vessels dilate and the heart slows. The diaphragm (C3-C5) and chest muscles weaken.",c:["Sympathetic signals lost","Vessels dilate, heart slows","Neurogenic shock"],tip:"Hypovolemic shock = fast pulse. Neurogenic = slow pulse."},
{p:"Ms. Cruz, 41|🤕|My nose keeps dripping.",s:"A client with a basal skull fracture has a thin stream of clear drainage from the right nostril. Which of the following actions should the nurse take first?",o:["Check the drainage for a halo ring or glucose","Suction the nostril gently","Pack the nostril with gauze","Ask the client to blow the nose"],r:"Assess first: clear drainage may be spinal fluid. Suctioning, packing or nose-blowing can push bacteria into the brain.",c:["Fracture tears the dura","Spinal fluid leaks, pathway opens","Meningitis"],tip:"'First' usually means assess, unless the client is unstable."},
{y:"sata",n:4,p:"Mr. Owens, 72|😮‍💨|I gained 3 pounds overnight.",s:"A nurse is assessing a client who has fluid overload. Which findings should the nurse expect? Select all that apply.",o:["Crackles in the lungs","Bounding pulse","Distended neck veins","Sudden weight gain","Weak, thready pulse","Flat neck veins"],r:"Extra volume fills the vessels and backs up into the lungs.",c:["Too much fluid in vessels","Pressure rises, fluid shifts to lungs","Crackles, edema, shortness of breath"],tip:"1 liter of fluid = about 1 kg of weight."},
{p:"Mr. Owens, 72|😴|My kidneys barely work.",s:"A nurse is reviewing arterial blood gases for a client who has chronic kidney disease. Which set of values should the nurse expect?",o:["pH 7.28, PaCO2 32, HCO3 15","pH 7.48, PaCO2 30, HCO3 24","pH 7.30, PaCO2 55, HCO3 26","pH 7.50, PaCO2 44, HCO3 34"],r:"Failing kidneys cannot excrete acid or make bicarbonate: metabolic acidosis. The lungs blow off CO2 to compensate.",c:["Kidneys retain acid","Bicarbonate used up","Metabolic acidosis"],tip:"Kidney = bicarbonate. Lung = CO2."},
{p:"Ms. Park, 45|😩|I am always tired, and I crave salt.",s:"A nurse is assessing a client who has Addison's disease. Which of the following findings should the nurse expect?",o:["Bronze skin with low blood pressure","Moon face with high blood pressure","Weight gain with a buffalo hump","High blood glucose with low potassium"],r:"Too little cortisol and aldosterone: sodium and water are lost, potassium is kept, and skin darkens. The other options describe Cushing's.",c:["Adrenal cortex fails","Low cortisol and aldosterone","Low BP, low Na, high K"],tip:"Addison's = Add steroids. Cushing's = Cushion of extra."}]},
{f:6,t:"Medical-Surgical Mix",e:"🏥",ref:"ATI-style practice set · Saunders 9th ed. Ch 49, 51, 52, 55, 61, 63",
kp:["Acute pancreatitis: nothing by mouth, IV fluids, pain control, possibly an NG tube","Kidney stones: dehydration, immobility, high-sodium or high-protein diet, gout","Emphysema: barrel chest, pursed-lip breathing, shortness of breath on exertion, quiet breath sounds","Rifampin: orange urine, sweat and tears (harmless, stains contact lenses)","HIV: the CD4 count shows immune status and infection risk","Bowel prep solution: drink a glass every 10-15 minutes, clear liquids only, stool should run clear","After knee arthroscopy: ice and elevation for 24 hours; report numbness, swelling or fever"],
v:[["🚫🍽️","Pancreatitis","Rest the gut: NPO"],["🛢️","Emphysema","Barrel chest, pursed lips"],["🍊","Rifampin","Orange everything"],["🛡️","HIV","CD4 = the priority number"]],
q:[
{p:"Mr. Kane, 50|😖|The pain bores straight through to my back.",s:"A nurse is admitting a client who has acute pancreatitis. Which provider prescription should the nurse anticipate?",o:["Nothing by mouth with IV fluids","A high-fat diet as tolerated","Clear liquids with each dose of pain medication","Ambulation after each meal"],r:"Food triggers the pancreas to release enzymes that digest the organ itself. Resting the gut stops the stimulus.",c:["Food enters the gut","Pancreatic enzymes released","Autodigestion and pain"],tip:"Pancreatitis = NPO first."},
{p:"Mr. Kane, 50|😣|Worst flank pain of my life.",s:"A nurse is caring for a client with a new diagnosis of urolithiasis. Which of the following is an associated risk factor?",o:["Long-term low fluid intake","A diet low in sodium","Daily brisk walking","A vegetarian diet low in protein"],r:"Concentrated urine lets minerals crystallize into stones.",c:["Low fluid intake","Urine concentrates","Crystals form stones"],tip:"Stones: fluids, fluids, fluids."},
{y:"sata",n:4,p:"Mr. Ford, 68|😮‍💨|Forty years of smoking caught up with me.",s:"A nurse is caring for a client who has emphysema. Which findings should the nurse expect? Select all that apply.",o:["Barrel-shaped chest","Shortness of breath on exertion","Pursed-lip breathing","Diminished breath sounds","Dull percussion over the lungs","Slow, deep respirations"],r:"Air is trapped in damaged alveoli, so the chest is over-inflated and sounds hyperresonant, not dull.",c:["Alveolar walls destroyed","Air trapping","Barrel chest, breathlessness"],tip:"Trapped air = hyperresonance."},
{p:"Mr. Hale, 58|😳|My urine is orange!",s:"A client with active tuberculosis has a new prescription for rifampin. Which of the following should the nurse tell the client to expect?",o:["Orange discoloration of urine and tears","Ringing in the ears","Numbness of the hands and feet","Darkening of the tongue"],r:"The color change is harmless. Numbness belongs to isoniazid; hearing loss to streptomycin.",c:["Drug is orange-red","Excreted in body fluids","Stained urine, tears, lenses"],tip:"Rifampin = Red-orange."},
{p:"Mr. Cole, 36|😟|What do my labs mean?",s:"A nurse is caring for a client who has HIV. Which laboratory value is the nurse's priority?",o:["CD4 count 180 cells/mm3","Hemoglobin 13 g/dL","Platelets 160,000/mm3","Sodium 137 mEq/L"],r:"A CD4 count under 200 defines AIDS and means a high risk of opportunistic infection.",c:["Virus destroys CD4 cells","Immune defense falls","Opportunistic infection"],tip:"Under 200 = AIDS."},
{p:"Mrs. Lin, 52|😬|I have to drink ALL of that?",s:"A nurse is teaching a client about bowel cleansing with polyethylene glycol solution before a colonoscopy. Which information should the nurse include?",o:["Drink a full glass every 10 to 15 minutes until it is gone","Sip the solution slowly over 12 hours","Eat a light solid meal halfway through","Stop once the first stool passes"],r:"It works by flushing volume through the bowel, so it must be taken quickly and completely. Chilling it improves the taste.",c:["Large volume taken fast","Bowel is flushed","Clear view for the scope"],tip:"Clear going in, clear coming out."},
{p:"Mr. Reed, 27|🙂|Knee scope done. Can I go home?",s:"A nurse is completing discharge teaching after arthroscopic knee surgery. Which instruction should the nurse include?",o:["Apply ice and keep the leg elevated for the first 24 hours","Apply heat to the knee every 2 hours","Expect numbness of the toes for a week","Keep the leg hanging down when sitting"],r:"Ice and elevation limit swelling. Numbness or color change means impaired circulation and is reported.",c:["Surgery inflames the joint","Swelling compresses vessels and nerves","Neurovascular compromise"],tip:"Numbness is never 'expected'."}]},
{f:6,t:"Dosage Calculations",e:"🧮",med:1,ref:"ATI-style practice set · Saunders 9th ed. Ch 14 & Ch 42",
kp:["1 mg = 1,000 mcg; 1 kg = 2.2 lb; 1 g = 1,000 mg","Tablets or mL = desired dose / dose on hand x quantity","Weight-based: convert pounds to kilograms first","mg/kg/DAY divided: work out the daily total, then divide by the number of doses","Round at the very end; leading zero yes (0.5), trailing zero no (5, not 5.0)"],
v:[["⚖️","lb to kg","Divide by 2.2"],["🔁","mcg to mg","Divide by 1,000"],["➗","Per day","Split by doses"],["0️⃣","Zeros","0.5 yes, 5.0 no"]],
q:[
{y:"calc",a:2,tol:0,u:"tablets",p:"Mr. Owens, 72|🙂|My heart pill, please.",s:"A client has a prescription for digoxin 250 mcg PO daily. Available is digoxin 0.125 mg tablets. How many tablets should the nurse give?",r:"250 mcg = 0.25 mg. 0.25 / 0.125 = 2 tablets.",c:["mcg to mg","/ tablet strength","Tablets"],tip:"Check the apical pulse for a full minute before digoxin."},
{y:"calc",a:3,tol:0.05,u:"mL",p:"Toby, 2|😤|No medicine!",s:"A toddler who weighs 26.4 lb is prescribed amoxicillin 40 mg/kg/day divided equally every 12 hours. Available is amoxicillin 400 mg/5 mL. How many mL per dose?",r:"26.4 / 2.2 = 12 kg. 12 x 40 = 480 mg/day. Two doses = 240 mg each. 240 / 400 x 5 = 3 mL.",c:["lb to kg","Daily total, then per dose","mg to mL"],tip:"'Per day' and 'per dose' are the classic trap."},
{y:"calc",a:31,tol:0.5,u:"gtt/min",p:"Mrs. Ito, 70|😌|(IV running by gravity)",s:"Prescribed: 0.9% sodium chloride 1,000 mL over 8 hours. The tubing delivers 15 gtt/mL. How many gtt/min? Round to a whole number.",r:"1,000 x 15 / 480 min = 31.25, so 31 gtt/min.",c:["Volume x drop factor","/ minutes","Drops per minute"],tip:"Drops cannot be fractions."},
{y:"calc",a:0.8,tol:0.02,u:"mL",p:"Mr. Kane, 50|😖|Please, something for the pain.",s:"Prescribed: morphine 4 mg IV. Available: morphine 5 mg/mL. How many mL? Round to the tenth.",r:"4 / 5 = 0.8 mL.",c:["Desired","/ have","mL"],tip:"Leading zero: 0.8."},
{y:"calc",a:18,tol:0.2,u:"mL/hr",p:"Dee, 34|🦵|(clot in her calf)",s:"Prescribed: heparin 900 units/hr IV. Available: heparin 25,000 units in 500 mL. What is the pump rate in mL/hr?",r:"25,000 / 500 = 50 units/mL. 900 / 50 = 18 mL/hr.",c:["Units per mL","Ordered units / concentration","mL/hr"],tip:"High-alert drug: independent double check."}]},
{f:6,t:"Pediatrics: Growth & Communication",e:"🧸",ref:"ATI-style practice set · Saunders 9th ed. Ch 18, 19 & 42",
kp:["Toddler exam: least invasive first; ears, mouth and throat LAST","Preschooler taking medicine: offer a limited choice (which cup), never ask 'will you take it?'","Regression (bedwetting) in hospital is expected; reassure the parents","Separation anxiety peaks around 8 months and shows healthy attachment","12 months: push-pull toys, large blocks; washable items under contact precautions","Vaccines at 12 months: MMR, varicella, hepatitis A, pneumococcal and Hib boosters","Numbing cream: thick layer on intact skin, cover with a clear dressing, 60 minutes before the stick"],
v:[["👂","Toddler exam","Ears and throat last"],["🥤","Choices","'Blue cup or red cup?'"],["😭","8 months","Stranger and separation anxiety"],["🧴","Numbing cream","60 minutes, covered"]],
q:[
{y:"sata",n:4,p:"Leo, 1|🙂|(birthday boy at his checkup)",s:"A nurse is preparing to give vaccines to a 1-year-old child. Which vaccines should the nurse plan to give? Select all that apply.",o:["Measles, mumps, rubella","Varicella","Hepatitis A","Pneumococcal conjugate","Rotavirus","Human papillomavirus"],r:"Live vaccines (MMR, varicella) begin at 12 months. Rotavirus must be finished by 8 months; HPV starts at 11-12 years.",c:["Maternal antibodies fade by 12 months","Live vaccines can now work","Immunity builds"],tip:"First birthday = first live vaccines."},
{y:"sata",n:4,p:"Mina, 4|😨|Will the needle hurt?",s:"A nurse plans to apply a numbing cream before starting an IV on a preschool-age child. Which actions should the nurse take? Select all that apply.",o:["Apply it 60 minutes before the procedure","Cover the cream with a clear occlusive dressing","Apply a thick layer to intact skin","Wipe the cream off before cleaning the site","Rub the cream in until it disappears","Apply it 5 minutes before the stick"],r:"The cream needs time and an occlusive cover to numb the skin. It sits on the surface and is not rubbed in.",c:["Cream sits under dressing","Anesthetic absorbs slowly","Numb skin at 60 minutes"],tip:"Timing is the testable detail."},
{p:"Leo, 2|😠|No! No! No!",s:"A nurse is assessing a toddler at a well-child visit. When should the nurse examine the tympanic membranes?",o:["At the end of the examination","Before listening to the heart and lungs","Immediately after measuring weight","While the child is asleep at the start"],r:"Invasive or upsetting parts go last so the child stays calm for heart and lung sounds.",c:["Invasive step done first","Toddler cries","Heart and lung sounds obscured"],tip:"Toddlers: least to most invasive."},
{p:"Mina, 4|😤|I do not want it!",s:"A nurse is caring for a 4-year-old who resists taking medication. Which strategy should the nurse use?",o:["Offer a choice of which drink to take it with","Ask the child if she is ready to take it","Tell her it tastes just like candy","Mix it into her full bottle of milk"],r:"A limited choice gives a preschooler control without making the medicine optional. Never call medicine candy.",c:["Preschooler wants control","Limited choice satisfies it","Cooperation"],tip:"Never ask a yes/no question you cannot accept 'no' to."},
{p:"Mina's dad|😳|She never wets the bed at home. I am so embarrassed.",s:"A 4-year-old with croup wet the bed overnight. Which response should the nurse make to the parent?",o:["It is common for children to slip back a step when they are in the hospital.","She should be trained by now, so we will test her urine.","Try limiting her fluids after dinner at home.","Do not worry. It is nothing to be embarrassed about."],r:"Regression is an expected response to the stress of illness and hospitalization. Giving information is more therapeutic than false reassurance.",c:["Stress of hospitalization","Child returns to earlier behavior","Temporary bedwetting"],tip:"'Do not worry' is almost never the right answer."},
{p:"Ava's mom|😢|She has never screamed like this when I leave.",s:"An 8-month-old infant screams when the parent leaves the room. Which statement should the nurse make?",o:["This is expected at her age and shows she is attached to you.","She is probably in pain; I will get medication.","It would be better if you slipped out while she sleeps.","Most infants do not react this way until age 2."],r:"Separation anxiety begins around 6-8 months once the infant knows the parent exists when out of sight.",c:["Object permanence develops","Infant knows parent is gone","Protest"],tip:"Encourage parents to stay; never sneak out."},
{p:"Leo, 1|🧸|(stuck in his room on contact precautions)",s:"Which toy should the nurse recommend for a 12-month-old on contact precautions?",o:["Large plastic stacking blocks","A stuffed bear from the playroom","A small-piece puzzle","A set of crayons and a coloring book"],r:"Washable plastic can be disinfected, and stacking suits a 12-month-old. Small pieces are a choking risk.",c:["Soft toy holds organisms","Cannot be cleaned","Spreads infection"],tip:"Two filters: age-appropriate AND washable."}]},
{f:6,t:"Pediatrics: Disorders",e:"🩹",ref:"ATI-style practice set · Saunders 9th ed. Ch 30-41",
kp:["Wilms' tumor: DO NOT PALPATE THE ABDOMEN","Cleft lip repair: elbow restraints, no prone position, no pacifier, keep the suture line clean","Hemophilia A: factor VIII replacement before procedures","Spina bifida: latex allergy risk (no balloons), skin checks","Hirschsprung disease: first surgery usually creates a temporary colostomy","Pyloric stenosis: hungry infant with projectile vomiting; needs to be seen","Cystic fibrosis: pancreatic enzymes with every meal and snack; high calories, protein and salt","Dehydration: weight is the most reliable measure","After tonsillectomy: cool clear liquids; no red, citrus or milk at first; frequent swallowing = bleeding","Abdominal exam: inspect, auscultate, percuss, palpate","New cast: neurovascular checks are the priority","Head lice: hot wash and dry; seal non-washables in a bag for 2 weeks"],
v:[["🚫✋","Wilms'","Do not palpate the abdomen"],["🎈","Spina bifida","Latex allergy"],["⚖️","Dehydration","Weigh the child"],["🧊","Tonsillectomy","Cool, clear, not red"]],
q:[
{p:"Noah, 3|😶|(firm lump on one side of his belly)",s:"A child is admitted with suspected Wilms' tumor. Which warning should the nurse post over the bed?",o:["Do not palpate the abdomen","No rectal temperatures","Strict bed rest","Contact precautions"],r:"Pressing on the tumor can rupture its capsule and seed cancer cells through the abdomen.",c:["Abdomen pressed","Tumor capsule ruptures","Cancer spreads"],tip:"Wilms' has one must-know rule."},
{p:"Baby Sam, 2 months|😴|(lip repaired this morning)",s:"A nurse is caring for an infant after surgical repair of a cleft lip. Which action should the nurse take?",o:["Apply elbow restraints","Place the infant prone","Offer a pacifier for comfort","Clean the incision with a dry gauze rub"],r:"The suture line must be protected from hands, the mattress and sucking.",c:["Hands or mattress rub the lip","Sutures stressed","Repair opens, scarring"],tip:"Lip repair: back or side, never tummy."},
{p:"Jay, 15|😬|Wisdom teeth out tomorrow.",s:"An adolescent with hemophilia A is scheduled for tooth extractions. Which product should the nurse anticipate?",o:["Factor VIII","Factor IX","Vitamin K","Packed red blood cells"],r:"Hemophilia A is a factor VIII deficiency. Factor IX is for hemophilia B.",c:["Missing factor VIII","Clot cannot form","Prolonged bleeding"],tip:"A = eight. B = nine."},
{p:"Tia, 14|🙂|I have managed my spina bifida for years.",s:"An adolescent with spina bifida is paralyzed from the waist down. Which statement indicates a need for further teaching?",o:["I helped blow up balloons for my friend's party.","I check the skin on my legs every day.","I use a clean catheter on a schedule.","I shift my weight in my chair often."],r:"Repeated latex exposure from catheters and surgeries makes latex allergy common. Balloons are latex.",c:["Repeated latex exposure","Sensitization","Anaphylaxis"],tip:"'Further teaching' = find the wrong statement."},
{p:"Sam's mom|🤔|So what will the first operation do?",s:"A parent of a child with Hirschsprung disease is preparing for the initial surgery. Which statement shows understanding?",o:["My child will have a temporary colostomy.","The colostomy will be permanent.","My child will need a feeding tube for life.","The surgery removes part of the stomach."],r:"The bowel segment without nerve cells is removed in stages; a temporary colostomy lets the bowel rest first.",c:["Segment has no nerve cells","No peristalsis there","Blockage and megacolon"],tip:"Hirschsprung: ribbon-like stools, temporary colostomy."},
{p:"Worried dad|😟|He is starving but throws up across the room after every bottle.",s:"A parent reports that his 2-month-old is hungrier than usual but has projectile vomiting right after eating. Which response should the nurse make?",o:["Bring your baby in to be seen today.","Try burping him more often.","Switch to a soy formula for a week.","Give smaller feedings and call back in 3 days."],r:"These are signs of pyloric stenosis. The infant can dehydrate quickly and needs evaluation.",c:["Pylorus muscle thickens","Stomach cannot empty","Projectile vomiting, dehydration"],tip:"Hungry + projectile = pyloric stenosis."},
{p:"Eli's parents|🙂|We have been reading about his diet.",s:"Parents of a child with cystic fibrosis receive nutrition teaching. Which response shows understanding?",o:["We will give enzymes with every meal and snack.","We will limit salt in his food.","We will keep his diet low in calories.","We will give enzymes only if his stools look greasy."],r:"Thick mucus blocks pancreatic enzymes from reaching the gut, so they are replaced at every meal. Salt is lost in sweat.",c:["Mucus blocks pancreatic ducts","No enzymes reach the gut","Fat and vitamins not absorbed"],tip:"CF diet: high everything."},
{p:"Baby Mia, 9 months|🤒|(2 days of vomiting and fever)",s:"Which is the most reliable indicator of fluid loss in an infant?",o:["Body weight","Skin turgor","Dry mucous membranes","Sunken fontanel"],r:"Weight change is objective and measurable. The other signs are useful but subjective.",c:["Fluid lost","Weight falls gram for mL","Degree of dehydration known"],tip:"'Most reliable' fluid question = weight."},
{p:"Ben, 6|😢|My throat hurts.",s:"A child is 2 hours postoperative after a tonsillectomy. Which should the nurse offer?",o:["Crushed ice","Cherry ice pop","Orange juice","Chocolate milk"],r:"Red hides bleeding, citrus stings, and milk coats the throat and prompts throat clearing.",c:["Throat clearing or irritation","Clot dislodged","Hemorrhage"],tip:"Frequent swallowing = bleeding."},
{y:"order",o:["Inspect the abdomen","Auscultate bowel sounds","Percuss the abdomen","Palpate the abdomen"],p:"Ben, 6|😬|Are you going to press on my tummy?",s:"A nurse is preparing to perform an abdominal assessment on a child. Identify the sequence the nurse should follow.",r:"Touching the abdomen changes bowel sounds, so listening comes before percussion and palpation.",c:["Palpate first","Bowel activity changes","False findings"],tip:"Abdomen is the exception: look, listen, then feel."},
{p:"Jay, 15|😣|They just put this cast on my leg.",s:"An adolescent has a newly applied fiberglass cast for a fractured tibia. Which is the nurse's priority?",o:["Check capillary refill and sensation in the toes","Teach cast care for home","Provide a diversional activity","Offer a snack and fluids"],r:"Swelling inside a rigid cast can cut off circulation and cause compartment syndrome.",c:["Swelling inside the cast","Pressure on vessels and nerves","Compartment syndrome"],tip:"New cast = circulation, movement, sensation."},
{p:"Zoe's parents|😖|Lice! What do we do with all her things?",s:"Parents are taught about head lice. Which statement shows understanding?",o:["We will seal her stuffed animals in a plastic bag for 2 weeks.","We will keep her home from school for a month.","We will shave her head to stop the spread.","We will wash her bedding in cold water."],r:"Lice die without a human host. Washables need hot water and a hot dryer.",c:["Lice need a host","No blood meal for 2 weeks","Lice and hatchlings die"],tip:"Lice cannot jump or fly: head-to-head contact."},
{p:"Charge nurse|🧐|Where do we put the new admission?",s:"A nurse is admitting a child who has leukemia. Which client is the best roommate?",o:["A child with a fractured femur","A child with pneumonia","A child with chickenpox","A child with a draining wound infection"],r:"Leukemia and its treatment suppress immunity, so the roommate must be free of infection.",c:["Low white cells","Cannot fight organisms","Overwhelming infection"],tip:"Room assignment = who is NOT infectious."},
{p:"Ben, 6|🤒|My ear hurts so bad.",s:"A nurse is caring for a child who has otitis media. Which finding should the nurse expect?",o:["A red, bulging eardrum","A pearly gray eardrum","Pain when the outer ear is pulled","Clear fluid from the nose"],r:"Pus behind the eardrum makes it red and bulging. Pain on pulling the ear points to outer ear infection.",c:["Short, flat ear tube","Fluid trapped and infected","Bulging, painful eardrum"],tip:"Middle ear = bulging drum. Outer ear = pain on tug."}]},
{f:6,t:"Ethics, Law & Therapeutic Communication",e:"⚖️",ref:"ATI-style practice set · Saunders 9th ed. Ch 6 & Ch 7",
kp:["Nurses are mandated reporters of suspected child abuse; state the fact calmly","Health information is shared only with those directly involved in care or named by the client","Nonmaleficence: do no harm. Beneficence: do good. Autonomy: client decides. Justice: fairness. Fidelity: keep promises. Veracity: tell the truth","Therapeutic responses reflect feelings and invite the client to say more","Avoid 'why' questions, advice, changing the subject and false reassurance"],
v:[["📞","Mandated reporter","Suspicion is enough"],["🔒","Privacy","Need to know only"],["🚫","Nonmaleficence","Do no harm"],["🪞","Reflect","Name the feeling, invite more"]],
q:[
{p:"Angry parent|😠|Why did you report us?",s:"A nurse reports suspected child abuse. A parent demands to know the reason. Which response is appropriate?",o:["I am required by law to report any suspected abuse.","The doctor told me I had to make the call.","Your child's injuries prove what you did.","I am sorry. I can withdraw the report if you wish."],r:"The response is honest, non-accusing and states the nurse's legal duty.",c:["Suspicion of abuse","Legal duty to report","Child protected"],tip:"Pick the factual, non-blaming answer."},
{p:"Mr. Gray, 81|😔|My mother died in the hospital, and I did not get there in time.",s:"A nurse is caring for a client who is dying. Which statement should the nurse make?",o:["Tell me more about what that was like for you.","Why did you not get there sooner?","Your family will be here; you need not worry.","Let's think about something more cheerful."],r:"An open invitation lets him explore his fear of dying alone. 'Why' blames; reassurance and distraction shut him down.",c:["Client hints at a fear","Nurse invites more","Fear is expressed and addressed"],tip:"Open-ended beats reassurance."},
{p:"Night nurse|😟|What if the dose is the thing that ends her life?",s:"A client dying of metastatic cancer has an opioid prescribed as needed. The nurse worries a dose might hasten death and considers withholding it. Which ethical principle supports that reasoning?",o:["Nonmaleficence","Autonomy","Justice","Veracity"],r:"Nonmaleficence is the duty to avoid harm. In practice, relieving pain (beneficence) and the client's wishes guide comfort care.",c:["Fear of causing harm","Nonmaleficence invoked","Must be weighed against relief of suffering"],tip:"Learn each principle as two words."},
{p:"New nurse|🤓|I think I understand the privacy rules.",s:"Which statement by a newly licensed nurse about health information privacy indicates a need for further teaching?",o:["I can update any caller who says they are a relative.","I will log off the computer before I walk away.","I will discuss clients only with staff involved in their care.","I will not leave printed reports at the bedside."],r:"Identity and the client's permission must be confirmed before sharing anything.",c:["Caller not verified","Information released","Privacy violation"],tip:"'Further teaching' = the unsafe statement."}]}
];
const EXTRA=[["🤲","Leopold's maneuvers","Four abdominal palpations to find fetal position. Have her empty her bladder first. Heart tones are loudest over the baby's back."],["📋","Bishop score","Rates the cervix (dilation, effacement, station, consistency, position). 8 or more means induction is likely to work."],["🤸","Newborn reflexes","Moro (startle), rooting, sucking, grasp, Babinski (toes fan out), stepping, tonic neck (fencing). Absent or one-sided responses are reported."],["🛏️","Safe sleep","On the back, alone, firm flat surface, no pillows, bumpers or soft toys. Room share without bed sharing."],["🚗","Car seat","Rear-facing in the back seat at a 45 degree angle; chest clip at armpit level; no bulky coats."],["✂️","Cord & circumcision care","Keep the cord dry and folded outside the diaper; it falls off in 10-14 days. Report redness or foul smell. After circumcision expect a yellow film; report bleeding or no urine."],["💊","Methotrexate for ectopic","Stops rapidly dividing cells. Teach: no folic acid, no alcohol, avoid sun, return for hCG checks."],["👯","Multiple gestation","Higher risk of preterm labor, anemia, preeclampsia and postpartum hemorrhage (overstretched uterus)."],["🚭","Substances","Tobacco: small baby, abruption. Alcohol: no safe amount, fetal alcohol spectrum. Cocaine: abruption, preterm birth."],["🧮","Fundal height","From 18 to 32 weeks, centimeters match weeks. Larger: multiples, extra fluid, mole. Smaller: growth restriction, low fluid."]];

const YES=["Boom! Somebody page the Chief, we have a prodigy on the floor.","Nailed it. The attendings are whispering about you (the good kind).","Correct! You just earned first pick of the snacks in the lounge.","Yes! That is a save. The family is baking you cookies.","Look at you, charting AND thinking. Unstoppable.","Right! The residents are nervous. Keep going.","Chef's kiss. Even the grumpy night-shift charge nurse smiled."];

/* chart room */
function chart(){window.scrollTo(0,0);let h=`<div class="bg-white rounded-3xl border-4 border-emerald-400 p-4 mb-3"><div class="text-2xl font-black text-emerald-700">📚 Chart Room</div><p class="font-bold text-sm">Every topic in course order: preconception and gynecology, pregnancy, birth, postpartum, newborn, then the bonus NCLEX review wing. Use the 🖍️ highlighter at the top.</p></div>`;
F.forEach((f,fi)=>{h+=`<div class="text-xl font-black mt-4 mb-2 rounded-2xl px-3 py-2 text-white bg-gradient-to-r ${f[2]}">${f[0]} ${f[1]}</div>`;R.filter(r=>r.f===fi).forEach(r=>{h+=`<details class="bg-white rounded-2xl border-4 border-slate-200 p-3 mb-2"><summary class="font-black cursor-pointer">${r.e} ${r.id+1}. ${r.t} ${r.med?"💊":""}</summary><ul class="list-disc pl-5 my-2 font-semibold text-sm space-y-1">${r.kp.map(k=>`<li>${k}</li>`).join("")}</ul>${viz(r)}<div class="text-xs font-bold text-slate-600 mt-2">📖 ${r.ref}</div></details>`})});
h+=`<div class="text-xl font-black mt-4 mb-2 rounded-2xl px-3 py-2 text-white bg-gradient-to-r from-slate-500 to-slate-700">📎 Additional Information / Diseases</div><div class="grid sm:grid-cols-2 gap-2">${EXTRA.map((c,i)=>`<div class="border-l-8 rounded-xl p-3 ${CC[i%6]}"><div class="text-2xl">${c[0]}</div><div class="font-black">${c[1]}</div><div class="text-sm font-semibold">${c[2]}</div></div>`).join("")}</div>`;app.innerHTML=h}
/* certificate */
function cert(){window.scrollTo(0,0);const n=R.filter((r,i)=>cleared(i)).length,all=n===R.length,avg=n?Math.round(R.reduce((a,r,i)=>a+(cleared(i)?S.done[i]:0),0)/n):0;
const floors=F.map((f,fi)=>{const rs=R.filter(r=>r.f===fi);return `${f[0]} ${f[1]}: ${rs.filter(r=>cleared(r.id)).length}/${rs.length}`}).join(" &nbsp;·&nbsp; ");
const c=`<div style="border:10px double #c026d3;padding:28px;margin:12px;text-align:center;background:#fffbeb;font-family:Georgia,serif"><div style="font-size:44px">🏥🏆</div><div style="font-size:15px;letter-spacing:3px;font-weight:bold">GREY SLOAN MEMORIAL HOSPITAL · OB ROTATION RUSH</div><div style="font-size:34px;font-weight:bold;color:#a21caf;margin:10px 0">Certificate of ${all?"Completion":"Progress"}</div><div>This certifies that</div><div style="font-size:30px;font-weight:bold;border-bottom:2px solid #333;display:inline-block;padding:4px 30px;margin:8px 0">${S.name||"________________"}</div><div style="margin-top:8px">has cleared <b>${n} of ${R.length}</b> rounds of the Maternal-Newborn rotation<br>with an average round score of <b>${avg}%</b>, earning <b>${S.xp} XP</b> and the rank of</div><div style="font-size:24px;font-weight:bold;color:#0369a1;margin:8px 0">${rank()}</div><div style="font-size:12px">${floors}</div><div style="margin-top:14px;font-size:13px">Best answer streak: ${S.best} &nbsp;·&nbsp; ${new Date().toLocaleDateString()}</div><div style="font-size:10px;margin-top:10px;color:#666">Study game for practice only. Not an official academic record.</div></div>`;
$("#certview").innerHTML=c;
app.innerHTML=`<div class="bg-white rounded-3xl border-4 border-amber-400 p-3"><div class="flex flex-wrap gap-2 mb-2"><input id="nm2" value="${S.name}" placeholder="Your name" class="border-4 border-sky-300 rounded-xl px-3 py-1 font-bold flex-1 min-w-0"><button class="btn bg-sky-300 border-sky-600" onclick="S.name=$('#nm2').value.trim();save();cert()">Update</button><button class="btn bg-amber-300 border-amber-600" onclick="window.print()">🖨️ Print / Save as PDF</button></div>${c}<p class="text-xs font-bold">Tip: in the print window choose "Save as PDF".</p></div>`}
hlbar();map();
</script>
</body>
</html>
