//DATA
const F=[["🌸","Women's Health Clinic","from-pink-400 to-rose-400"],["🤰","Prenatal Clinic","from-violet-400 to-fuchsia-400"],["🚨","High-Risk Antepartum Unit","from-red-400 to-orange-400"],["👶","Labor & Delivery","from-sky-400 to-cyan-400"],["🤱","Mother-Baby Unit","from-emerald-400 to-teal-400"],["🍼","Nursery & NICU","from-amber-400 to-yellow-400"],["🎓","NCLEX Mixed Review Wing","from-indigo-400 to-blue-500"]];
const R=[
{f:0,t:"Preconception Care",e:"🌱",ref:"ATI Maternal Newborn Ch 4 (Prenatal Care) · Ricci Ch 12",
kp:["Folic acid 400 mcg (0.4 mg) daily, started BEFORE conception; 4 mg daily if a prior neural tube defect","Live vaccines (MMR, varicella) are given before pregnancy; avoid conceiving for 28 days","Teratogens to flag: isotretinoin, warfarin, ACE inhibitors, valproic acid, alcohol","Tight glucose control before conception lowers birth-defect risk"],
v:[["🥬","Folic acid","400 mcg daily BEFORE pregnancy. Neural tube closes by week 4"],["💉","Live vaccines","MMR and varicella now, then wait 28 days"],["☠️","Teratogens","Isotretinoin, warfarin, ACE inhibitors, valproate"]],
q:[
{p:"Maya, 27|😊|We want to start trying for a baby this summer!",s:"Maya asks which supplement matters most right now. Which teaching is the priority?",o:["Begin folic acid 400 mcg daily now, before conception","Start folic acid once a pregnancy test is positive","Take vitamin A 10,000 units daily for fetal vision","Iron alone is enough until the second trimester"],r:"The neural tube closes about 4 weeks after conception, often before the client knows she is pregnant, so folic acid must already be on board.",c:["Low folate at conception","Neural tube fails to close by week 4","Spina bifida or anencephaly"],tip:"If an option says 'before conception' for folic acid, it usually wins."},
{p:"Priya, 24|🙂|My rubella test says I am not immune.",s:"Priya plans to conceive soon and is rubella non-immune. What should the nurse teach?",o:["Receive MMR now and avoid pregnancy for 28 days","Receive MMR during the first trimester","No vaccine is needed because antibodies cross anyway","Get MMR in the third trimester for passive immunity"],r:"MMR is a live virus vaccine. It is contraindicated in pregnancy, so it is given before conception (or postpartum) with 28 days of contraception.",c:["Live attenuated virus","Could cross the placenta","Theoretical congenital rubella risk"],tip:"Live vaccine + pregnancy = never. MMR and varicella are the two to remember."},
{y:"sata",n:4,p:"Dana, 31|🤔|Here is my medication list.",s:"Which items on a preconception medication list must the nurse flag as teratogenic? Select all that apply.",o:["Isotretinoin","Warfarin","Lisinopril","Valproic acid","Acetaminophen","Prenatal vitamin"],r:"Isotretinoin, warfarin, ACE inhibitors and valproic acid are classic teratogens. Acetaminophen and prenatal vitamins are considered safe.",c:["Teratogen exposure weeks 3-8","Disrupts organ formation","Structural birth defects"],tip:"ACE inhibitors ('-pril') are a favorite hidden teratogen on exams."},
{y:"calc",a:10,u:"tablets",p:"Elena, 33|😟|My first baby had spina bifida.",s:"Elena is prescribed folic acid 4 mg PO daily. Available: folic acid 400 mcg tablets. How many tablets per dose?",r:"4 mg = 4,000 mcg. 4,000 / 400 = 10 tablets. A prior neural tube defect calls for the high 4 mg dose.",c:["Prior NTD","Higher recurrence risk","Dose raised from 0.4 mg to 4 mg"],tip:"Convert mg to mcg first (x 1,000)."}]},
{f:0,t:"Contraception",e:"💊",ref:"ATI Maternal Newborn Ch 1 (Contraception) · Ricci Ch 4",
kp:["Combined pills: warning signs ACHES (Abdominal pain, Chest pain, Headache, Eye problems, Severe leg pain)","Combined pills contraindicated: smoker over 35, clot history, migraine with aura, hypertension, breast cancer","Medroxyprogesterone injection every 3 months; bone loss, so calcium + vitamin D; do NOT massage the site; fertility return is delayed","Diaphragm: spermicide each time, leave in at least 6 hr after sex, never over 24 hr, refit after 20% weight change, void before insertion","Copper IUD lasts 10 years; check strings monthly","Levonorgestrel emergency contraception works best within 72 hr"],
v:[["🚨","ACHES","Abdominal pain, Chest pain, Headache, Eye changes, Severe leg pain = stop the pill"],["🦴","Depo shot","Every 3 months, calcium + vitamin D, no massage"],["⏱️","Diaphragm","In for 6 hr after sex, out by 24 hr"],["🧵","IUD","Check strings monthly"]],
q:[
{p:"Tasha, 29|😣|My calf is swollen and it really hurts.",s:"Tasha takes a combined oral contraceptive and reports severe pain and swelling in one calf. What is the priority?",o:["Tell her to stop the pill and be evaluated for a clot today","Suggest warm compresses and leg elevation tonight","Reassure her that leg cramps are common in month one","Advise taking the pill at bedtime to ease side effects"],r:"Severe leg pain is the S in ACHES. Estrogen raises clotting factors, so this is a possible DVT until proven otherwise.",c:["Estrogen raises clotting factors","Clot forms in a deep leg vein","Risk of pulmonary embolism"],tip:"Unilateral calf pain on estrogen is never 'normal'."},
{y:"sata",n:4,p:"Renee, 26|🙂|I just got fitted for a diaphragm.",s:"Which statements show correct diaphragm use? Select all that apply.",o:["I will leave it in at least 6 hours after intercourse","I will use spermicide with each act of intercourse","I need a refit if my weight changes by 20%","I will empty my bladder before inserting it","It can stay in place for up to 48 hours","I can use an oil-based lubricant to insert it"],r:"Leaving it over 24 hours risks toxic shock syndrome, and oil-based products damage the device.",c:["Diaphragm left in over 24 hr","Bacteria multiply","Toxic shock syndrome"],tip:"6 hours minimum, 24 hours maximum."},
{y:"matrix",cols:["Contraindicated","Not a contraindication"],rows:[["Age 36, smokes one pack per day",0],["Migraine with aura",0],["History of deep vein thrombosis",0],["Painful periods",1],["Age 22 with acne",1]],p:"Clinic clients|🧐|Can I have the combined pill?",s:"For each client finding, decide whether a combined (estrogen) contraceptive is contraindicated.",r:"Estrogen raises clot and stroke risk, so smokers over 35, clients with aura migraines and those with clot history cannot take it. It actually helps dysmenorrhea and acne.",c:["Estrogen + existing vascular risk","More clotting","Stroke, MI, DVT"],tip:"Think 'clot risk' for every estrogen question."},
{p:"Jo, 20|🙂|I picked the shot.",s:"Which teaching is correct for medroxyprogesterone injections?",o:["Return every 3 months and keep calcium and vitamin D intake up","Return monthly and massage the injection site well","Fertility returns the week after a missed dose","It also protects against infections for 3 months"],r:"The injection is given every 11 to 13 weeks, lowers bone density, and should not be massaged. Fertility can take many months to return.",c:["Progestin suppresses estrogen","Bone mineral density falls","Osteoporosis risk"],tip:"Depo = bones. Calcium, vitamin D, weight-bearing exercise."}]},
{f:0,t:"Infertility",e:"🧪",ref:"ATI Maternal Newborn Ch 2 (Infertility) · Ricci Ch 4",
kp:["Infertility: no conception after 12 months of unprotected sex (6 months if age 35 or older)","Semen analysis comes FIRST (least invasive)","Hysterosalpingography: check for iodine or shellfish allergy; cramping and referred shoulder pain can occur","Clomiphene induces ovulation: multiple gestation, hot flashes, visual changes, ovarian hyperstimulation"],
v:[["🔬","First test","Semen analysis: cheap and non-invasive"],["🦐","Dye test","Ask about iodine or shellfish allergy"],["👯","Clomiphene","Twins or more are possible"]],
q:[
{p:"Sam & Lee, 30|😟|We have been trying for 14 months.",s:"Which diagnostic test does the nurse expect first?",o:["Semen analysis","Hysterosalpingogram","Diagnostic laparoscopy","Endometrial biopsy"],r:"Start with the least invasive test. A male factor is involved in a large share of couples.",c:["Least invasive first","Rules out male factor early","Avoids needless invasive testing"],tip:"'First' or 'initial' in infertility = semen analysis."},
{p:"Lee, 30|😬|They are doing a dye test on my tubes.",s:"Before a hysterosalpingogram, which assessment is the priority?",o:["Allergy to iodine or shellfish","Time of last bowel movement","Family history of twins","Rubella titer result"],r:"Iodine-based contrast is injected through the cervix. An allergy could cause anaphylaxis.",c:["Iodine contrast","Allergic reaction","Anaphylaxis"],tip:"Any contrast dye question: allergy first."},
{y:"sata",n:4,p:"Nora, 32|🙂|I start clomiphene this cycle.",s:"What should the nurse teach about clomiphene? Select all that apply.",o:["Twins or triplets are possible","Hot flashes can occur","Report bloating, pelvic pain or fast weight gain","Report blurred vision or spots","Take it every day of the cycle","It is given only to the male partner"],r:"Clomiphene stimulates ovulation. Bloating, pain and rapid weight gain suggest ovarian hyperstimulation syndrome.",c:["Ovaries overstimulated","Fluid shifts into the abdomen","Bloating, weight gain, pain"],tip:"Rapid weight gain on a fertility drug = hyperstimulation."},
{y:"drop",s:"Infertility is evaluated after ___ months of unprotected intercourse, or after ___ months when the woman is 35 or older.",dd:[["12","6","24"],["6","3","18"]],p:"Ava, 36|🤔|How long should we try before we ask for help?",r:"The 12-month rule shortens to 6 months at age 35 and up because egg quantity and quality fall with age.",c:["Age 35+","Fewer, older eggs","Evaluate sooner"],tip:"12 months, or 6 if 35 or older."}]},
{f:0,t:"Gynecologic Disorders",e:"🌺",ref:"Ricci Ch 4 & Ch 7 (Common Reproductive Issues, Benign Disorders)",
kp:["Primary dysmenorrhea: excess prostaglandins, so NSAIDs are first line","Endometriosis: tissue outside the uterus; cyclic pain, painful intercourse, infertility; confirmed by laparoscopy","PCOS: irregular or absent ovulation, hirsutism, acne, insulin resistance; metformin and combined pills","Menopause: 12 months without menses; any bleeding after that must be reported","Toxic shock: tampon use, sudden high fever, sunburn-like rash, hypotension"],
v:[["🔥","Cramps","Prostaglandins squeeze the uterus: NSAIDs block them"],["🧩","Endometriosis","Pain with periods and sex; laparoscopy confirms"],["🧔‍♀️","PCOS","Hair, acne, irregular periods, insulin resistance"],["🌡️","Toxic shock","Tampon + fever + rash + low BP"]],
q:[
{p:"Bri, 24|😣|My cramps have been awful since I was 13.",s:"Bri's pelvic exam is normal. Which medication and rationale fit primary dysmenorrhea?",o:["NSAIDs, because they block prostaglandin production","Opioids, because they relax the uterine muscle","Antibiotics, because cramps signal an infection","Diuretics, because the pain comes from fluid"],r:"Prostaglandins cause strong uterine contractions and ischemia. NSAIDs work best started just before or at the onset of menses.",c:["Excess prostaglandins","Strong contractions and ischemia","Cramping pain"],tip:"Dysmenorrhea = prostaglandins = NSAIDs."},
{y:"matrix",cols:["Endometriosis","PCOS"],rows:[["Hirsutism and acne",1],["Deep pain with intercourse and cyclic pelvic pain",0],["Insulin resistance and weight gain",1],["Confirmed by laparoscopy",0],["Absent ovulation with enlarged cystic ovaries",1]],p:"Two clients|🧐|We both have trouble getting pregnant.",s:"Match each finding to the disorder.",r:"Both cause infertility, but PCOS is hormonal and metabolic (androgens, insulin) while endometriosis is misplaced tissue that bleeds and scars.",c:["PCOS: high androgens","No ovulation","Irregular periods and infertility"],tip:"Hair and insulin = PCOS. Pain = endometriosis."},
{p:"Kim, 19|🤒|I feel terrible and I have a rash everywhere.",s:"Kim uses super-absorbent tampons. Temp 39.4 C, sunburn-like rash, BP 84/50. What is the priority?",o:["Have the tampon removed and start IV fluids as prescribed","Give acetaminophen and recheck her in 4 hours","Apply hydrocortisone to the rash and discharge her","Teach her to change brands of tampon"],r:"This is toxic shock syndrome. Remove the source and support circulation; she is heading into shock.",c:["Staph toxin from retained tampon","Massive vasodilation","Shock"],tip:"Low BP beats a rash every time: circulation first."},
{y:"sata",n:4,p:"Gloria, 53|🥵|These hot flashes are wearing me out.",s:"Which teaching is appropriate for menopause? Select all that apply.",o:["Do weight-bearing exercise","Take calcium and vitamin D","Use a water-soluble lubricant for dryness","Report any bleeding after 12 months without periods","Hormone therapy is safe after breast cancer","Stop contraception once periods become irregular"],r:"Falling estrogen causes bone loss and vaginal dryness. Postmenopausal bleeding can signal endometrial cancer. Contraception continues until 12 months without menses.",c:["Estrogen falls","Bone resorption rises","Osteoporosis"],tip:"Postmenopausal bleeding is cancer until proven otherwise."}]},
{f:0,t:"Sexually Transmitted Infections",e:"🦠",ref:"ATI Maternal Newborn Ch 8 (Infections) · Ricci Ch 5",
kp:["Chlamydia: most common, often silent; azithromycin (no doxycycline in pregnancy)","Gonorrhea: ceftriaxone IM; treat partners","Syphilis: painless chancre, then rash on palms and soles; penicillin G is the only treatment in pregnancy (desensitize if allergic)","Trichomoniasis: frothy yellow-green discharge, strawberry cervix; metronidazole, no alcohol","Bacterial vaginosis: thin gray discharge, fishy odor, clue cells","Candidiasis: thick white curd-like discharge with itching","Untreated infection can climb upward and cause PID, which leads to infertility and ectopic pregnancy"],
v:[["🟢","Trichomoniasis","Frothy yellow-green, strawberry cervix"],["🐟","Bacterial vaginosis","Thin gray, fishy odor, clue cells"],["🧀","Candida","Thick white curds, itching"],["⬆️","PID","Infection climbs: fever, cervical motion tenderness"]],
q:[
{y:"matrix",cols:["Trichomoniasis","Candidiasis","Bacterial vaginosis"],rows:[["Frothy yellow-green discharge, strawberry cervix",0],["Thick white curd-like discharge with itching",1],["Thin gray discharge, fishy odor, clue cells",2]],p:"Three clients|😳|Something is not right down there.",s:"Match each discharge description to the infection.",r:"Discharge appearance is the key differentiator between these three infections.",c:["Organism type","Characteristic discharge","Specific treatment"],tip:"Green and frothy = trich. Fishy = BV. Cottage cheese = yeast."},
{p:"Kayla, 19|🤒|My belly hurts so much, and I never finished those pills.",s:"Kayla was treated for trichomoniasis 2 weeks ago, did not finish the medication, and her partner was not treated. Now: lower abdominal pain, temp 38.6 C, cervical motion tenderness. What does the nurse suspect?",o:["Pelvic inflammatory disease from ascending infection","A normal reaction to metronidazole","A recurrent yeast infection","Primary dysmenorrhea"],r:"Untreated or reinfected lower tract infection ascends to the uterus and tubes. Fever plus cervical motion tenderness points to PID.",c:["Incomplete treatment and untreated partner","Organisms ascend to uterus and tubes","Scarring: infertility, ectopic pregnancy"],tip:"Cervical motion tenderness is the PID buzzword."},
{y:"sata",n:4,p:"Kayla, 19|😔|What do I need to do differently this time?",s:"Which teaching about metronidazole is correct? Select all that apply.",o:["Avoid alcohol during treatment","My partner must be treated too","No intercourse until we both finish treatment","Finish every dose even if I feel better","Stop once the discharge clears","Douching daily speeds the cure"],r:"Alcohol with metronidazole causes a disulfiram-like reaction (severe nausea, vomiting). Untreated partners cause reinfection.",c:["Partner untreated","Reinfection","Ascending infection and PID"],tip:"Metronidazole + alcohol = violent vomiting."},
{p:"Ines, 28|😟|I am 14 weeks pregnant and allergic to penicillin.",s:"Ines tests positive for syphilis. What does the nurse anticipate?",o:["Penicillin desensitization, then penicillin G","Doxycycline for 14 days","Waiting to treat the newborn after birth","Topical acyclovir applied to the lesion"],r:"Penicillin G is the only drug proven to treat the fetus. Doxycycline is contraindicated in pregnancy.",c:["Spirochete crosses the placenta","Fetal infection","Congenital syphilis or stillbirth"],tip:"Syphilis in pregnancy has one answer: penicillin."}]},
{f:0,t:"Breast & Gynecologic Cancers",e:"🎗️",ref:"Ricci Ch 6 & Ch 8 (Disorders of the Breasts, Cancers of the Female Reproductive Tract)",
kp:["Cancerous breast lump: hard, painless, fixed, irregular; dimpling (orange-peel skin), nipple retraction","Fibrocystic changes: tender, mobile, change with the cycle","After mastectomy with node removal: no BP, IV or injections in that arm; elevate; watch for lymphedema","Cervical cancer: HPV; Pap testing begins at 21; bleeding after intercourse","Ovarian cancer: vague bloating, early fullness, CA-125; found late","Endometrial cancer: postmenopausal bleeding"],
v:[["🪨","Cancer lump","Hard, fixed, painless, dimpled skin"],["🫧","Fibrocystic","Tender, mobile, cyclic"],["💪","Mastectomy arm","No BP, no needles, elevate"],["🎈","Ovarian","Vague bloating: the silent one"]],
q:[
{p:"Carol, 48|😟|I found a lump in the shower.",s:"Which breast finding is most concerning?",o:["A hard, fixed, painless lump with skin dimpling","Tender mobile lumps that swell before each period","Soreness in both breasts the week before menses","A soft, round, movable nodule present for years"],r:"Malignant masses are typically hard, fixed and painless. Dimpling happens when the tumor pulls on ligaments.",c:["Tumor invades tissue","Pulls on suspensory ligaments","Dimpling and retraction"],tip:"Painless + fixed = worrying. Tender + mobile = usually benign."},
{y:"sata",n:4,p:"Carol, 48|😌|My surgery was on the right side.",s:"Carol had a right mastectomy with lymph node removal. Which actions are correct? Select all that apply.",o:["No blood pressures or needle sticks in the right arm","Elevate the right arm on a pillow","Report swelling or redness of the arm","Do the prescribed arm exercises","Keep the arm completely still for 6 weeks","Carry heavy bags on the right side to build strength"],r:"Node removal impairs lymph drainage. Constriction or injury raises the risk of lymphedema and infection.",c:["Lymph nodes removed","Lymph cannot drain","Lymphedema and infection"],tip:"Affected arm: nothing tight, nothing sharp."},
{y:"matrix",cols:["Cervical","Endometrial","Ovarian"],rows:[["Bleeding after menopause",1],["Vague bloating, early fullness, rising CA-125",2],["Bleeding after intercourse, HPV positive",0]],p:"Three clients|🧐|What could this be?",s:"Match each cue to the most likely cancer.",r:"Each gynecologic cancer has one signature cue that exams love.",c:["Location of tumor","Signature symptom","Screening or marker"],tip:"HPV = cervical. Postmenopausal bleeding = endometrial. Bloating = ovarian."},
{p:"Zoe, 21|🙂|When do I need a Pap test?",s:"What is the best response?",o:["Start now at 21, regardless of when sex began","Wait until 30 unless symptoms appear","Only if the HPV vaccine series was missed","Three years after menopause begins"],r:"Cervical screening starts at age 21 whether or not the client is sexually active or vaccinated.",c:["HPV infection","Slow cervical cell change","Pap catches it early"],tip:"Pap starts at 21. Vaccine does not replace screening."}]},
{f:0,t:"Violence, Ethics & Communication",e:"🛡️",ref:"Ricci Ch 9 (Violence and Abuse) · course case studies",
kp:["Screen every client for partner violence, alone and in private","Cycle: tension building, acute battering, honeymoon","Pregnancy raises the risk of abuse","Do not pressure the client to leave; build a safety plan and document objectively with her own words","Use a qualified medical interpreter, never family or children","Autonomy: a competent client may refuse care or leave"],
v:[["🚪","Privacy","Interview the client alone"],["🔁","Cycle","Tension, battering, honeymoon"],["🗣️","Interpreter","Qualified interpreter, never family"],["📝","Document","Objective, direct quotes"]],
q:[
{p:"Mara, 25|😨|He likes to answer for me.",s:"Mara has bruises in different stages of healing. Her partner answers every question. What is the priority?",o:["Arrange to interview the client alone","Ask the partner how the bruises happened","Hand her a shelter brochure in front of him","Tell her she must leave him today"],r:"Screening only works in private. Confronting the partner or giving materials in front of him can raise her danger.",c:["Partner present","Client cannot disclose safely","Abuse stays hidden"],tip:"Abuse question? Get the client alone first."},
{y:"order",o:["Ensure privacy and immediate safety","Assess injuries and level of danger","Document objectively using her words","Help build a safety plan and give resources"],p:"Mara, 25|😢|He said he would hurt me if I told anyone.",s:"Mara discloses abuse. Place the nursing actions in priority order.",r:"Safety first, then assessment, documentation and planning. Maslow puts safety before teaching.",c:["Disclosure","Danger peaks","Safety comes first"],tip:"Safety, assess, document, plan."},
{p:"Rosa, 34|😕|No entiendo.",s:"Rosa speaks only Spanish and needs to sign consent. Her husband offers to translate. What should the nurse do?",o:["Request a qualified medical interpreter","Let the husband translate to save time","Ask the client's 12-year-old daughter","Have her sign and explain afterward"],r:"Family may filter or change information. Informed consent requires understanding, so a qualified interpreter is required.",c:["Family interprets","Information altered or withheld","Consent is not informed"],tip:"Interpreter questions: 'qualified' is the magic word."},
{y:"sata",n:4,p:"Dana, 22|😠|Nobody here listens to me. I am leaving.",s:"Dana, 17 weeks pregnant, walks out of her prenatal visit upset. Which responses are appropriate? Select all that apply.",o:["Acknowledge her feelings without judgment","Respect her right to leave","Give warning signs and invite her back","Document the event objectively","Tell her she is being irresponsible","Block the door until the provider comes"],r:"A competent client has autonomy. The nurse keeps the door open, gives safety information and documents facts.",c:["Client feels unheard","Trust breaks down","Missed prenatal care"],tip:"Never restrain, threaten or shame a competent client."}]},
{f:1,t:"Fetal Development",e:"🧬",ref:"Ricci Ch 10 (Fetal Development and Genetics) · ATI Ch 3",
kp:["Weeks 3 to 8 (embryonic stage): organs form, highest teratogen risk","Cord: 2 arteries, 1 vein (AVA), protected by Wharton's jelly","hCG keeps the corpus luteum alive; hPL causes maternal insulin resistance; progesterone relaxes smooth muscle","Quickening about 16 to 20 weeks","Lungs mature when the L/S ratio is 2:1 (about 35 weeks)"],
v:[["⚠️","Weeks 3-8","Organ building: most vulnerable"],["🪢","Cord","AVA: Artery, Vein, Artery"],["🫁","L/S 2:1","Lungs are ready"],["🦋","Quickening","16-20 weeks"]],
q:[
{p:"Jen, 23|😰|I took a medicine before I knew I was 6 weeks pregnant.",s:"Why is exposure at 6 weeks the highest-risk period?",o:["Organs are forming during weeks 3 to 8","The placenta has not started making hCG","The fetus gains weight fastest at this time","Surfactant production peaks in this window"],r:"Organogenesis occurs in the embryonic stage. Later exposures affect growth and function more than structure.",c:["Teratogen in weeks 3-8","Organ formation disrupted","Structural defects"],tip:"Embryonic stage = organ stage = danger stage."},
{p:"Baby Ortiz|👶|(wiggling under the warmer)",s:"Which umbilical cord finding is expected?",o:["Two arteries and one vein","Two veins and one artery","One artery and one vein","Two arteries and two veins"],r:"A two-vessel cord is linked with kidney and heart anomalies and must be reported.",c:["Missing artery","Associated anomalies","Needs further evaluation"],tip:"AVA."},
{y:"matrix",cols:["hCG","hPL","Progesterone"],rows:[["Keeps the corpus luteum alive; basis of pregnancy tests",0],["Creates maternal insulin resistance",1],["Relaxes smooth muscle and maintains the uterine lining",2]],p:"Student nurse|🤓|Which hormone does what?",s:"Match each action to the placental hormone.",r:"hPL frees glucose for the fetus, which is the root of gestational diabetes. Progesterone's muscle relaxing explains constipation and heartburn.",c:["hPL rises","Maternal cells resist insulin","More glucose for the fetus"],tip:"hPL is the diabetes hormone of pregnancy."},

{f:1,t:"Maternal Changes in Pregnancy",e:"🤰",ref:"ATI Maternal Newborn Ch 3 (Expected Physiological Changes) · Ricci Ch 11",
kp:["Presumptive (client feels): amenorrhea, nausea, fatigue, breast changes, quickening, frequency","Probable (examiner finds): Hegar, Chadwick, Goodell, ballottement, Braxton Hicks, positive pregnancy test","Positive: fetal heart tones, ultrasound, movement felt by examiner","Blood volume rises 30-50%: physiologic anemia; pulse up 10-15/min","Supine hypotension: turn to the left side","Fundus at the umbilicus at 20 weeks; cm = weeks from 18 to 32","GTPAL: Gravida, Term, Preterm, Abortions, Living"],

q:[
{y:"matrix",cols:["Presumptive","Probable","Positive"],rows:[["Positive urine pregnancy test",1],["Fetal heart tones by Doppler",2],["Amenorrhea and nausea",0],["Chadwick's sign (bluish cervix)",1],["Client reports quickening",0]],p:"Lena, 26|🤔|Am I definitely pregnant?",s:"Classify each sign of pregnancy.",r:"A positive test is only probable because other conditions (such as a molar pregnancy) raise hCG.",c:["hCG detected","Other causes possible","Probable, not positive"],tip:"Pregnancy test = probable. Exams love this trap."},
{p:"Lena, 26|😵|I feel so dizzy lying here.",s:"Lena is 30 weeks, lying supine. She is pale, BP 88/50. What is the first action?",o:["Turn her onto her left side","Raise the head of the bed to 90 degrees","Start oxygen at 2 L by nasal cannula","Call the provider for a fluid bolus order"],r:"The heavy uterus compresses the vena cava. Side-lying restores venous return within moments.",c:["Uterus compresses vena cava","Venous return and cardiac output fall","Hypotension, less placental flow"],tip:"Pregnant + supine + dizzy = left side."},
{p:"Lena, 26|🙂|This is my fourth pregnancy.",s:"Lena is pregnant now. History: twins born at 35 weeks (both alive), one child born at 39 weeks, one miscarriage at 9 weeks. What is her GTPAL?",o:["G4 T1 P1 A1 L3","G4 T1 P2 A1 L3","G3 T1 P1 A1 L3","G5 T2 P1 A1 L3"],r:"Twins count as one pregnancy and one preterm birth, but two living children.",c:["Twins = 1 pregnancy","1 birth event","2 living"],tip:"Count pregnancies for G, T, P, A. Count kids only for L."},
{p:"Lena, 26|😊|How big should my belly be at 20 weeks?",s:"Where does the nurse expect the fundus at 20 weeks?",o:["At the level of the umbilicus","Just above the symphysis pubis","At the xiphoid process","Halfway between symphysis and umbilicus"],r:"12 weeks: just above the symphysis. 20 weeks: umbilicus. 36 weeks: xiphoid.",c:["Uterus grows","Fundus rises about 1 cm a week","cm matches weeks"],tip:"20 weeks = belly button."}]},
{f:1,t:"Prenatal Care & Nutrition",e:"🥗",ref:"ATI Maternal Newborn Ch 4 & 5 (Prenatal Care, Nutrition) · Ricci Ch 12",
kp:["Naegele's rule: first day of last period, minus 3 months, plus 7 days","Weight gain with normal BMI: 25 to 35 lb","Iron: take with vitamin C, not milk; dark stools and constipation expected","Avoid unpasteurized foods, deli meats (listeria), high-mercury fish; limit caffeine","Glucose screen 24-28 weeks; Tdap 27-36 weeks; Group B strep culture 36-37 weeks","Danger signs: bleeding, gush of fluid, severe headache, visual changes, epigastric pain, less fetal movement"],
v:[["📅","Naegele","LMP - 3 months + 7 days"],["🍊","Iron","With orange juice, never milk"],["🚨","Danger signs","Bleeding, fluid gush, headache, vision, no movement"],["🧀","Listeria","No deli meat or unpasteurized cheese"]],
q:[
{p:"Amy, 28|😊|My last period started March 10.",s:"Using Naegele's rule, what is Amy's estimated due date?",o:["December 17","December 3","January 10","November 17"],r:"March 10 minus 3 months = December 10; plus 7 days = December 17.",c:["LMP","- 3 months + 7 days","Due date"],tip:"Back 3 months, forward 7 days."},
{y:"sata",n:4,p:"Amy, 28|🙂|The iron pills upset my stomach a bit.",s:"Which iron teaching is correct? Select all that apply.",o:["Take it with orange juice","Expect dark stools","Increase fiber and fluids","Take it between meals if tolerated","Take it with milk to protect the stomach","Stop it if stools turn black"],r:"Vitamin C boosts absorption. Calcium blocks it. Dark stools and constipation are expected.",c:["Calcium binds iron","Less iron absorbed","Anemia persists"],tip:"Iron + C = yes. Iron + milk = no."},
{y:"sata",n:4,p:"Amy, 28|🤔|When should I call you right away?",s:"Which findings must be reported immediately? Select all that apply.",o:["A gush of fluid from the vagina","Severe headache with blurred vision","Decreased fetal movement","Vaginal bleeding","Urinary frequency in the first trimester","Irregular tightening that eases with walking"],r:"These suggest ruptured membranes, preeclampsia, fetal compromise and placental problems.",c:["Danger sign missed","Delay in care","Maternal or fetal harm"],tip:"Headache + vision = think preeclampsia."},
{y:"matrix",cols:["24-28 weeks","27-36 weeks","36-37 weeks"],rows:[["1-hour glucose screening",0],["Tdap vaccine",1],["Group B strep culture",2]],p:"Amy, 28|📋|What is coming up at my visits?",s:"Match each prenatal item to its timing.",r:"hPL-driven insulin resistance peaks in the late second trimester. Tdap in each pregnancy passes pertussis antibodies to the baby.",c:["Test timed to physiology","Problem found on time","Treatment before harm"],tip:"Glucose 24-28. Strep near the end."}]},
{f:1,t:"Fetal Well-Being Testing",e:"📈",ref:"ATI Maternal Newborn Ch 6 (Assessment of Fetal Well-Being) · Ricci Ch 12",
kp:["Nonstress test REACTIVE (good): 2 or more accelerations of 15 beats for 15 seconds in 20 minutes","Contraction stress test NEGATIVE (good): no late decelerations. POSITIVE (bad): late decelerations with half or more of contractions","Biophysical profile: 5 parts, each 0 or 2 (reactive NST, breathing, movement, tone, fluid). 8-10 normal, 6 equivocal, 4 or less abnormal","Amniocentesis: ultrasound guided; Rh-negative clients get Rho(D) immune globulin; report leaking, fever, bleeding, contractions","Kick counts: fewer than 10 in 2 hours, call"],
v:[["✅","NST reactive","15 x 15, twice in 20 min = happy baby"],["➖","CST negative","Negative is GOOD here"],["🔟","BPP","5 items x 2 points; 8-10 is normal"],["💉","Amnio","Rh-negative needs RhoGAM"]],
q:[
{p:"Tess, 30|😬|Is my baby okay?",s:"A 20-minute nonstress test shows baseline 140/min and three accelerations of 20 beats lasting 20 seconds. How does the nurse interpret this?",o:["Reactive, a reassuring result","Nonreactive; prepare for a stress test","Positive; anticipate delivery today","Unsatisfactory; repeat in one week"],r:"Two or more 15 x 15 accelerations in 20 minutes means an intact, oxygenated nervous system.",c:["Fetus well oxygenated","Heart rate speeds with movement","Reactive test"],tip:"Reactive = reassuring. Both start with R."},
{y:"calc",a:8,tol:0,u:"points",p:"Tess, 30|🙂|They did a long ultrasound.",s:"Biophysical profile: reactive NST, one breathing episode of 30 seconds, three body movements, one flexion-extension of a limb, and NO adequate pocket of amniotic fluid. What is the total score?",r:"NST 2 + breathing 2 + movement 2 + tone 2 + fluid 0 = 8.",c:["Chronic low oxygen","Less kidney perfusion","Low amniotic fluid"],tip:"Each item is all (2) or nothing (0)."},
{p:"Tess, 30|😟|They gave me medicine to cause contractions.",s:"A contraction stress test shows late decelerations with more than half of contractions. How is this interpreted?",o:["Positive, suggesting uteroplacental insufficiency","Negative, the expected healthy response","Reactive, with good oxygen reserve","Equivocal from maternal position alone"],r:"A positive CST is abnormal: the placenta cannot keep up during contractions.",c:["Contraction squeezes placental vessels","Poor reserve","Late decelerations"],tip:"CST: positive = problem."},
{y:"sata",n:4,p:"Uma, 37|😌|The needle part is over.",s:"Uma is Rh-negative and just had an amniocentesis at 16 weeks. Which actions are appropriate? Select all that apply.",o:["Monitor fetal heart rate and contractions","Teach her to report leaking fluid, fever or bleeding","Give Rho(D) immune globulin","Advise rest for 24 hours","Tell her clear leaking for 2 days is expected","Keep her bladder full for 6 hours afterward"],r:"The needle can mix fetal and maternal blood, so an Rh-negative client needs protection from sensitization.",c:["Needle crosses placenta area","Fetal blood enters mother","Sensitization unless RhoGAM given"],tip:"Any invasive procedure + Rh-negative = RhoGAM."}]},
{f:1,t:"Rho(D) Immune Globulin",e:"🩸",med:1,ref:"ATI Maternal Newborn Ch 4, 7 & 19 · Ricci Ch 19",
kp:["Problem: Rh-negative mother, Rh-positive fetus","Give 300 mcg IM at 28 weeks AND within 72 hours after birth of an Rh-positive baby","Also after miscarriage, ectopic, amniocentesis, trauma, bleeding","Only if the mother is NOT already sensitized (indirect Coombs negative)","Kleihauer-Betke test measures fetal blood in the mother to decide on extra doses"],
v:[["➖➕","Mismatch","Rh- mom + Rh+ baby"],["🛡️","Antibodies","Mom makes anti-D that attack the NEXT baby"],["💉","RhoGAM","28 weeks + within 72 hr after birth"],["🧪","Coombs","Indirect = mom. Direct = baby"]],
q:[
{p:"Holly, 29|🙂|My blood type is O negative.",s:"Holly's indirect Coombs is negative and her newborn is Rh-positive. What does the nurse do?",o:["Give Rho(D) immune globulin within 72 hours of birth","Give it to the newborn before discharge","Hold it because the Coombs test is negative","Give it only if another pregnancy is planned"],r:"A negative indirect Coombs means she has no antibodies yet, which is exactly when the drug can prevent them.",c:["Fetal Rh+ cells enter at birth","Drug destroys them first","No maternal antibodies form"],tip:"Negative Coombs = give it. Positive = too late."},
{y:"sata",n:5,p:"Holly, 29|🤔|When else would I need that shot?",s:"For an unsensitized Rh-negative client, when is Rho(D) immune globulin indicated? Select all that apply.",o:["After a miscarriage","After amniocentesis","At 28 weeks of pregnancy","After abdominal trauma","After an ectopic pregnancy","When her indirect Coombs is already positive","When the newborn is Rh-negative"],r:"Any event that could mix fetal and maternal blood calls for a dose.",c:["Blood mixing event","Possible sensitization","Dose prevents it"],tip:"Bleeding or needles in an Rh-negative pregnancy = dose."},
{y:"order",o:["Rh-positive fetal cells enter the Rh-negative mother's blood","The mother forms anti-D antibodies","In a later pregnancy, antibodies cross the placenta","Fetal red blood cells are destroyed","Fetal anemia, jaundice and hydrops develop"],p:"Student nurse|🤓|Walk me through it.",s:"Place the steps of Rh sensitization in order.",r:"The first baby is usually spared; the antibodies wait for the next Rh-positive pregnancy.",c:["Sensitization","Antibodies cross placenta","Hemolytic disease of the newborn"],tip:"First baby primes, second baby pays."},
{y:"calc",a:2,tol:0,u:"vials",p:"Holly, 29|😟|They said a lot of the baby's blood got into mine.",s:"One 300 mcg vial covers 30 mL of fetal whole blood. A Kleihauer-Betke test estimates 60 mL of fetal blood in Holly's circulation. How many vials are needed?",r:"60 / 30 = 2 vials.",c:["Large fetomaternal bleed","One vial is not enough","Extra dose prevents sensitization"],tip:"Kleihauer-Betke = how much RhoGAM."}]},
{f:2,t:"Early Pregnancy Bleeding",e:"🩸",ref:"ATI Maternal Newborn Ch 7 (Bleeding During Pregnancy) · Ricci Ch 19",
kp:["Threatened abortion: bleeding, cervix closed. Inevitable: cervix open. Missed: fetus not viable, nothing passed, cervix closed. Septic: fever, foul discharge","Ectopic: one-sided stabbing pain, spotting; shoulder pain and shock when ruptured","Methotrexate for unruptured ectopic: no folic acid, no alcohol, sun protection","Molar pregnancy: uterus larger than dates, very high hCG, dark brown bleeding with grape-like vesicles, no fetal heart tones, preeclampsia before 20 weeks","After a mole: hCG followed for a year with reliable contraception (cancer risk)"],
v:[["⚡","Ectopic","One-sided pain, shoulder pain, shock"],["🍇","Molar","Grapes, big uterus, sky-high hCG"],["🚪","Cervix","Closed = threatened. Open = inevitable"],["📉","After a mole","Track hCG for 1 year, no pregnancy"]],
q:[
{p:"Nina, 27|😨|Sharp pain on my right side, and now my shoulder hurts.",s:"Nina is 8 weeks pregnant. BP 86/48, pulse 124, dizzy. What is the priority?",o:["Establish large-bore IV access and prepare for surgery","Give the scheduled methotrexate dose","Obtain a clean-catch urine sample","Teach about the hCG follow-up schedule"],r:"Shoulder pain plus shock means a ruptured tube with blood irritating the diaphragm. Methotrexate is only for unruptured, stable cases.",c:["Tube ruptures","Blood fills the abdomen","Hypovolemic shock"],tip:"Shoulder pain in early pregnancy = rupture."},
{y:"matrix",cols:["Threatened","Inevitable","Missed"],rows:[["Spotting and mild cramps, cervix closed",0],["Bleeding, cervix dilated, membranes ruptured",1],["No fetal heartbeat, no tissue passed, cervix closed",2]],p:"Three clients|😢|Am I losing the baby?",s:"Match the findings to the type of spontaneous abortion.",r:"The cervix is the deciding cue between threatened and inevitable.",c:["Cervix opens","Pregnancy cannot continue","Inevitable loss"],tip:"Look for the cervix in the stem."},
{y:"sata",n:4,p:"Ivy, 19|🤢|I have been so sick, and my belly is already big.",s:"Which findings fit a molar pregnancy? Select all that apply.",o:["Uterus larger than expected for dates","Dark brown discharge with grape-like vesicles","Markedly elevated hCG","No fetal heart tones","Fundal height small for dates","hCG lower than expected"],r:"Abnormal trophoblast tissue overgrows and pumps out hCG, causing severe nausea and a large uterus.",c:["Trophoblast overgrowth","hCG soars","Big uterus, hyperemesis, early preeclampsia"],tip:"Preeclampsia before 20 weeks? Think mole."},
{p:"Ivy, 19|😔|When can we try again?",s:"After evacuation of a molar pregnancy, what teaching is the priority?",o:["Use reliable contraception while hCG is monitored for a year","Try to conceive again within 3 months","hCG checks stop after the first negative result","Avoid contraception because it hides rising hCG"],r:"A new pregnancy would raise hCG and mask choriocarcinoma, which is detected by rising hCG.",c:["Leftover trophoblast tissue","Can turn malignant","Rising hCG is the only warning"],tip:"Mole follow-up = hCG + contraception."}]},
{f:2,t:"Late Bleeding: Previa vs. Abruption",e:"🆘",ref:"ATI Maternal Newborn Ch 7 (Bleeding During Pregnancy) · Ricci Ch 19",
kp:["Placenta previa: PAINLESS bright red bleeding, soft non-tender uterus; NO vaginal exams","Abruption: PAINFUL, dark red bleeding (may be hidden), rigid board-like uterus, fetal distress","Abruption risks: hypertension, cocaine, trauma, smoking","Abruption can trigger DIC as clotting factors are used up","Both: large-bore IV, type and crossmatch, continuous fetal monitoring"],
v:[["🟥","Previa","Painless, bright red, soft uterus, hands off the cervix"],["🟫","Abruption","Painful, dark red, board-like uterus"],["❄️","Cocaine + HTN","Vessels clamp, placenta shears off"],["🩸","DIC","Clotting factors used up: bleeding everywhere"]],
q:[
{y:"matrix",cols:["Placenta previa","Abruption"],rows:[["Painless bright red bleeding",0],["Rigid, board-like abdomen",1],["Dark red bleeding with constant pain",1],["Soft, relaxed, non-tender uterus",0],["Linked to cocaine use and hypertension",1]],p:"Two clients at 33 weeks|😨|I am bleeding!",s:"Match each finding to the condition.",r:"Pain and uterine tone separate the two. Previa bleeds because the placenta covers the cervix; abruption bleeds behind the placenta.",c:["Placenta separates early","Blood trapped behind it","Pain, rigid uterus, fetal hypoxia"],tip:"Previa = Painless. Abruption = Agony."},
{p:"Jade, 30|😰|I woke up in a pool of blood, but nothing hurts.",s:"Jade is 32 weeks with painless bright red bleeding. Which prescription should the nurse question?",o:["Perform a sterile vaginal exam for dilation","Start an 18-gauge IV line","Apply the external fetal monitor","Type and crossmatch blood"],r:"A finger through the cervix can puncture a previa and cause massive hemorrhage.",c:["Exam disturbs placenta over cervix","Vessels tear","Massive bleeding"],tip:"Bleeding in late pregnancy: no vaginal exams until previa is ruled out."},
{y:"bow",bt:{c:["Placental abruption","Placenta previa","Preterm labor"],a:["Start large-bore IV access and give oxygen","Prepare for emergency cesarean birth","Perform a vaginal exam for dilation","Encourage her to walk"],p:["Fetal heart rate pattern","Clotting studies and bleeding","Fundal height weekly","Daily weight"]},p:"Kat, 34|😖|It will not stop hurting. My belly is rock hard.",s:"Kat, 34 weeks, used cocaine today. BP 170/104, sudden constant abdominal pain, small dark bleeding, rigid uterus, late decelerations. Complete the bowtie: condition, 2 actions, 2 parameters to monitor.",r:"Classic abruption. Support circulation and oxygen, deliver, and watch the fetus and clotting.",c:["Cocaine vasospasm","Placenta shears off","Fetal hypoxia and maternal hemorrhage"],tip:"Small visible bleeding does not mean small blood loss in abruption."},
{p:"Jade, 30|😟|Is it the placenta?",s:"A nurse is caring for a client at 36 weeks of gestation who has a suspected placenta previa. Which of the following findings supports this diagnosis?",o:["Painless bright red vaginal bleeding","A rigid, tender abdomen","Dark red bleeding with constant pain","Contractions with no relaxation between"],r:"The placenta lies over the cervix. As the cervix thins late in pregnancy, placental vessels tear and bleed without pain.",c:["Placenta covers the cervix","Cervix thins and vessels tear","Painless bright red bleeding"],tip:"The other three options all describe abruption."},
{p:"Kat, 34|😵|Why is my IV site bleeding?",s:"Why does abruption lead to DIC?",o:["Clotting factors are consumed at the clot behind the placenta","Platelets are destroyed by maternal antibodies","The liver stops producing vitamin K","Oxytocin release thins the blood"],r:"Damaged placental tissue releases thromboplastin, triggering widespread clotting that uses up factors and platelets.",c:["Tissue thromboplastin released","Widespread clotting uses up factors","Uncontrolled bleeding"],tip:"DIC = clotting first, then bleeding."}]},
{f:2,t:"Hyperemesis Gravidarum",e:"🤮",ref:"ATI Maternal Newborn Ch 9 (Medical Conditions) · Ricci Ch 19",
kp:["Severe vomiting with weight loss of 5% or more, dehydration, ketonuria","Labs: low potassium, high urine specific gravity, high hematocrit (hemoconcentration)","Priority: IV fluids and electrolytes; NPO at first","Medications: pyridoxine (B6) with doxylamine, ondansetron, metoclopramide","Then small, dry, frequent meals; fluids between meals"],
v:[["⚖️","5% weight loss","More than morning sickness"],["🧪","Ketones","Body is burning fat"],["🍌","Potassium","Low K = dysrhythmias"],["🥨","Diet","Dry crackers first, fluids between meals"]],
q:[
{p:"Mia, 22|🤢|I throw up eight times a day.",s:"Mia is 10 weeks pregnant and has lost 6% of her weight. Which lab is the priority to report?",o:["Potassium 2.9 mEq/L","Urine specific gravity 1.025","Hemoglobin 12 g/dL","Blood glucose 78 mg/dL"],r:"Vomiting loses potassium and acid. Hypokalemia threatens cardiac rhythm.",c:["Persistent vomiting","Potassium lost","Dysrhythmias"],tip:"Potassium out of range is almost always the priority lab."},
{y:"sata",n:4,p:"Mia, 22|😩|I cannot keep anything down.",s:"Which findings does the nurse expect? Select all that apply.",o:["Ketones in the urine","Elevated urine specific gravity","Weight loss over 5%","Dry mucous membranes","Slow, bounding pulse","Swelling of face and hands"],r:"Dehydration concentrates urine and speeds the pulse. Starvation burns fat and produces ketones.",c:["No intake","Fat burned for fuel","Ketonuria"],tip:"Dehydration = fast, weak pulse, never bounding."},
{p:"Mia, 22|😵|I am so dizzy.",s:"What is the priority intervention on admission?",o:["Start IV fluids and keep her NPO as prescribed","Offer a high-fat meal to boost calories","Encourage large glasses of water with meals","Schedule nutrition counselling next week"],r:"Fluid and electrolyte replacement comes first; the gut is rested until vomiting stops.",c:["Fluid volume deficit","Poor perfusion","Maternal and fetal compromise"],tip:"Circulation before nutrition."},
{y:"calc",a:125,u:"mL/hr",p:"Mia, 22|😌|That IV is helping.",s:"Prescribed: lactated Ringer's 1,000 mL IV over 8 hours. What rate does the nurse set on the pump?",r:"1,000 mL / 8 hr = 125 mL/hr.",c:["Volume","Divided by hours","mL per hour"],tip:"Pump = mL per hour."}]},
{f:2,t:"Preeclampsia, Eclampsia & HELLP",e:"⚡",ref:"ATI Maternal Newborn Ch 9 (Medical Conditions) · Ricci Ch 19",
kp:["Gestational hypertension: 140/90 or more after 20 weeks, NO protein","Preeclampsia: hypertension + proteinuria","Severe features: 160/110 or more, headache, visual changes, epigastric or right upper quadrant pain, low urine output, platelets under 100,000","Eclampsia: seizures. HELLP: Hemolysis, Elevated Liver enzymes, Low Platelets","Cause: vasospasm and endothelial damage; the cure is delivery of the placenta","Seizure: side-lying, protect airway, nothing in the mouth"],
v:[["🩺","Gestational HTN","High BP, no protein"],["🧪","Preeclampsia","High BP + protein"],["🧨","Warning signs","Headache, spots, epigastric pain"],["🩸","HELLP","Hemolysis, Liver enzymes up, Platelets down"]],
q:[
{p:"Grace, 35|😣|I have a pain under my ribs on the right.",s:"Grace is 34 weeks, BP 164/112, 3+ protein. What does the epigastric pain suggest?",o:["Liver involvement and rising seizure risk","Heartburn from uterine pressure","Gallstones unrelated to pregnancy","Round ligament stretching"],r:"Liver swelling stretches its capsule. This is a severe feature and often comes just before a seizure.",c:["Vasospasm","Liver ischemia and swelling","Epigastric pain, then seizure"],tip:"Epigastric pain in preeclampsia = act now."},
{y:"cues",ph:[["BP 158/108",1],["fundal height 33 cm at 33 weeks",0],["reports seeing spots",1],["fetal heart rate 145 with moderate variability",0],["platelets 88,000",1],["trace ankle swelling at day's end",0],["urine output 20 mL/hr",1],["reflexes 4+ with clonus",1]],p:"Grace, 35|😟|My head is pounding.",s:"Tap the findings in the nurse's note that need immediate follow-up.",r:"Severe-range pressure, visual changes, low platelets, low urine output and brisk reflexes with clonus all signal worsening disease.",c:["Vasospasm in brain and kidney","Irritable CNS, poor filtration","Seizure, kidney injury"],tip:"Ankle swelling alone is normal in pregnancy."},
{y:"matrix",cols:["Gestational hypertension","Preeclampsia","HELLP syndrome"],rows:[["BP 146/94 at 30 weeks, no protein",0],["BP 150/98 with 2+ proteinuria",1],["AST 240, platelets 70,000, hemolysis",2]],p:"Three clients|🧐|What do I have?",s:"Match the findings to the disorder.",r:"Protein separates preeclampsia from gestational hypertension; labs define HELLP.",c:["Endothelial damage","Leaky kidneys, damaged liver","Protein loss, enzyme rise"],tip:"No protein = gestational hypertension."},
{p:"Grace, 35|😵|(begins to seize)",s:"Grace begins a tonic-clonic seizure. What is the priority action?",o:["Turn her to her side and protect her airway","Insert a padded tongue blade","Check the fetal heart rate first","Restrain her arms to prevent injury"],r:"Airway first. Side-lying prevents aspiration and improves placental flow. Never put anything in the mouth or restrain.",c:["Seizure","Airway at risk, apnea","Maternal and fetal hypoxia"],tip:"Seizure = side, safety, suction, oxygen."}]},
{f:2,t:"Magnesium Sulfate",e:"🧲",med:1,ref:"ATI Maternal Newborn Ch 9 & 10 · Ricci Ch 19",
kp:["Purpose: prevents seizures (it is not a blood pressure drug)","Loading dose 4-6 g IV over 15-30 min, then 1-2 g/hr by pump","Therapeutic level 4-7 mEq/L","Toxicity: absent reflexes, respirations under 12, urine under 30 mL/hr, drowsiness","Toxic? STOP the infusion first, then calcium gluconate","Expected: warmth and flushing","Raises postpartum hemorrhage risk (relaxed uterus)"],
v:[["🦵","Reflexes","Gone first"],["🫁","Breathing","Under 12 = toxic"],["🚽","Urine","Under 30 mL/hr = it builds up"],["🥛","Antidote","Calcium gluconate at the bedside"]],
q:[
{p:"Grace, 35|😴|So... sleepy...",s:"Grace is on magnesium. Respirations 10/min, reflexes absent, urine 20 mL/hr. What is the first action?",o:["Stop the magnesium infusion","Give calcium gluconate IV","Notify the provider by phone","Reassess reflexes in 15 minutes"],r:"Remove the cause first, then give the antidote and call.",c:["Low urine output","Magnesium accumulates","Respiratory and cardiac arrest"],tip:"Toxic drug running? Stop it first."},
{y:"calc",a:300,u:"mL/hr",p:"Grace, 35|🥵|I feel hot all over.",s:"Prescribed: magnesium sulfate 4 g IV loading dose over 20 minutes. Available: 40 g in 1,000 mL. What pump rate delivers the loading dose?",r:"40 g/1,000 mL = 1 g per 25 mL. 4 g = 100 mL over 20 min = 300 mL/hr.",c:["Concentration","Volume for dose","Rate for time"],tip:"Find mL for the dose, then scale to 60 minutes."},
{y:"calc",a:50,u:"mL/hr",p:"Grace, 35|🙂|How long will this drip run?",s:"Maintenance: magnesium sulfate 2 g/hr. Available: 20 g in 500 mL. What is the pump rate?",r:"20 g/500 mL = 1 g per 25 mL. 2 g = 50 mL/hr.",c:["g per mL","x dose per hour","mL/hr"],tip:"Always on a pump, never free-flowing."},
{y:"matrix",cols:["Expected","Report now"],rows:[["Feeling warm and flushed",0],["Respirations 10/min",1],["Urine output 25 mL/hr",1],["Reflexes 2+",0],["Magnesium level 9 mEq/L",1]],p:"Grace, 35|😌|Is this normal?",s:"Classify each finding during magnesium therapy.",r:"Magnesium is cleared by the kidneys, so low urine output predicts toxicity.",c:["CNS and muscle depression","Reflexes then breathing slow","Arrest"],tip:"Check reflexes, respirations, urine every hour."},
{p:"Charge nurse|🧐|What do you keep at the bedside?",s:"Which medication must be immediately available?",o:["Calcium gluconate","Naloxone","Protamine sulfate","Vitamin K"],r:"Calcium gluconate reverses magnesium's effect on muscle and heart.",c:["Magnesium blocks calcium","Muscle weakness","Calcium reverses it"],tip:"Mag antidote = calcium gluconate."}]},
{f:2,t:"Gestational Diabetes",e:"🍬",ref:"ATI Maternal Newborn Ch 9 (Medical Conditions) · Ricci Ch 20",
kp:["Cause: hPL makes the mother insulin resistant in the second half of pregnancy","Screen at 24-28 weeks","Targets: fasting under 95; 2-hour after meals under 120","Diet and exercise first; insulin if needed (does NOT cross the placenta)","Glucose crosses the placenta, so the fetus makes extra insulin and grows large","Newborn risks: hypoglycemia, respiratory distress, birth injury","After the placenta delivers, insulin needs fall sharply"],
v:[["🍰","Glucose crosses","Mom's sugar reaches baby"],["💉","Insulin does not","Baby makes its own, and too much"],["🏋️","Macrosomia","Big baby, shoulder dystocia"],["📉","After birth","Baby's sugar crashes"]],
q:[
{p:"Sofia, 33|🤔|Why would my baby be big?",s:"Which explanation of macrosomia is correct?",o:["Maternal glucose crosses the placenta, and the fetus makes extra insulin","Maternal insulin crosses the placenta and acts as growth hormone","hPL directly enlarges fetal fat cells","The fetus cannot make its own insulin"],r:"Fetal insulin acts as a growth hormone, storing the extra glucose as fat.",c:["High maternal glucose","Fetal hyperinsulinemia","Macrosomia"],tip:"Sugar crosses, insulin does not."},
{p:"Baby Reyes|😬|(jittery, 1 hour old)",s:"The newborn of a mother with gestational diabetes is jittery. What is the priority?",o:["Check a heel-stick blood glucose","Swaddle and recheck at the next feeding","Obtain a bilirubin level","Give vitamin K now"],r:"The baby still makes high insulin, but the maternal glucose supply ended when the cord was cut.",c:["Cord clamped","High insulin, no glucose supply","Hypoglycemia"],tip:"Jittery newborn = check glucose."},
{y:"sata",n:4,p:"Sofia, 33|🙂|I got my meter today.",s:"Which teaching is correct? Select all that apply.",o:["Check glucose fasting and after meals","Fasting goal is under 95 mg/dL","Insulin is safe because it does not cross the placenta","Walking after meals helps","Skip the bedtime snack to lower the fasting level","It always goes away, so no follow-up is needed"],r:"A bedtime snack prevents overnight ketosis. She needs glucose testing after birth and has a lifelong higher risk of type 2 diabetes.",c:["Insulin resistance","High glucose after meals","Fetal overgrowth"],tip:"Follow-up after pregnancy is always needed."},
{y:"drop",s:"Screening is done at ___ weeks, and after the placenta delivers, insulin needs ___.",dd:[["24 to 28","10 to 12","36 to 38"],["drop sharply","double","stay unchanged"]],p:"Sofia, 33|😊|What happens after delivery?",r:"The placenta is the source of hPL. Once it is out, resistance vanishes.",c:["Placenta delivered","hPL gone","Insulin need falls"],tip:"Placenta out = resistance out."}]},
{f:2,t:"Infections in Pregnancy",e:"🧫",ref:"ATI Maternal Newborn Ch 8 (Infections) · Ricci Ch 20",
kp:["TORCH: Toxoplasmosis, Other, Rubella, Cytomegalovirus, Herpes","Toxoplasmosis: cat litter, raw meat, garden soil","Group B strep positive: IV penicillin G during labor","HIV: antiretrovirals; avoid scalp electrodes, amniotomy, episiotomy, vacuum or forceps; bathe newborn before injections","Hepatitis B positive mother: newborn gets vaccine AND immune globulin within 12 hours","Active genital herpes lesions: cesarean birth","Chorioamnionitis: fever, maternal and fetal tachycardia, foul fluid"],
v:[["🐈","Toxoplasmosis","No litter box, cook meat"],["🧫","Group B strep","Penicillin in labor"],["🚫","HIV in labor","No procedures that break baby's skin"],["⏰","Hep B mom","Vaccine + HBIG in 12 hr"]],
q:[
{p:"Tori, 26|🙂|My strep swab was positive.",s:"Tori is in active labor and Group B strep positive. What does the nurse anticipate?",o:["IV penicillin G during labor","Oral amoxicillin after the birth","A cesarean to avoid exposure","No treatment unless fever develops"],r:"Antibiotics during labor lower bacterial counts in the birth canal and protect the baby from sepsis.",c:["Baby passes through colonized canal","Bacteria enter newborn","Sepsis, pneumonia, meningitis"],tip:"GBS+ = antibiotics in labor, not before."},
{y:"sata",n:4,p:"Bea, 31|😟|I am HIV positive. Please protect my baby.",s:"Which should be AVOIDED during Bea's labor? Select all that apply.",o:["Fetal scalp electrode","Amniotomy","Episiotomy","Vacuum-assisted birth","IV zidovudine","Bathing the newborn before injections"],r:"Anything that breaks the baby's skin or exposes it to maternal blood raises transmission.",c:["Skin barrier broken","Exposure to maternal blood","Virus transmitted"],tip:"HIV in labor: keep baby's skin intact."},
{p:"Baby Chen|👶|(just born)",s:"The mother is hepatitis B surface antigen positive. What does the newborn need?",o:["Hepatitis B vaccine and immune globulin within 12 hours","Hepatitis B vaccine only, at 2 months","Immune globulin only if breastfeeding","Isolation from the mother for 24 hours"],r:"Immune globulin gives instant antibodies; the vaccine builds lasting protection. Use separate thighs.",c:["Exposure at birth","No antibodies yet","Chronic infection without both"],tip:"Positive mom = both, within 12."},
{y:"sata",n:4,p:"Fay, 29|🐱|I have three cats.",s:"How can Fay prevent toxoplasmosis? Select all that apply.",o:["Have someone else change the litter","Cook meat thoroughly","Wear gloves when gardening","Wash fruits and vegetables","Avoid all contact with children","Get the toxoplasmosis vaccine"],r:"The parasite lives in cat feces, soil and raw meat. There is no vaccine.",c:["Parasite ingested","Crosses placenta","Fetal brain and eye damage"],tip:"She can keep the cats, just not the litter box."}]},
{f:2,t:"Preterm Labor & Ruptured Membranes",e:"⏳",ref:"ATI Maternal Newborn Ch 10 (Early Onset of Labor) · Ricci Ch 21",
kp:["Preterm labor: contractions with cervical change between 20 and 37 weeks","Fetal fibronectin negative: birth unlikely in the next 2 weeks","Betamethasone 12 mg IM, 2 doses 24 hours apart: speeds surfactant","Nifedipine: watch for low BP. Indomethacin: under 32 weeks, short course. Magnesium: protects the fetal brain","Terbutaline 0.25 mg subcutaneous: tachycardia, chest pain, tremors","Preterm ruptured membranes: no digital exams, temperature checks, watch for infection"],
v:[["🫁","Betamethasone","2 shots, 24 hr apart, lungs mature"],["💓","Terbutaline","Racing heart: hold and call"],["🧪","Fibronectin","Negative = not yet"],["🌡️","Ruptured membranes","Infection watch, no exams"]],
q:[
{p:"Lily, 25|😰|It is too early!",s:"Lily is 30 weeks in preterm labor. Why is betamethasone given?",o:["To speed fetal lung surfactant production","To stop contractions within the hour","To prevent maternal infection","To lower maternal blood pressure"],r:"Steroids mature the lungs and reduce respiratory distress syndrome. They do not stop labor.",c:["Steroid given","Surfactant production rises","Less respiratory distress"],tip:"Betamethasone = baby's lungs."},
{y:"calc",a:2,u:"mL",p:"Lily, 25|😬|Another shot?",s:"Prescribed: betamethasone 12 mg IM. Available: 6 mg/mL. How many mL?",r:"12 / 6 = 2 mL.",c:["Dose","/ concentration","mL"],tip:"Desired over have."},
{y:"calc",a:0.25,tol:0.005,u:"mL",p:"Lily, 25|😖|They keep coming.",s:"Prescribed: terbutaline 0.25 mg subcutaneous. Available: 1 mg/mL. How many mL?",r:"0.25 / 1 = 0.25 mL.",c:["Dose","/ concentration","mL"],tip:"Use a leading zero: 0.25."},
{p:"Lily, 25|😨|My heart is pounding and my chest feels tight.",s:"After terbutaline, Lily's pulse is 134/min with chest tightness. What does the nurse do?",o:["Hold the next dose and notify the provider","Give the dose; a fast pulse is always expected","Increase IV fluids to 250 mL/hr","Have her walk to slow the pulse"],r:"Terbutaline stimulates beta receptors in the heart as well as the uterus. Chest pain and marked tachycardia mean stop.",c:["Beta stimulation","Heart rate climbs","Ischemia, pulmonary edema"],tip:"Follow your facility's pulse cutoff; chest pain always means hold."},
{y:"sata",n:4,p:"Wren, 28|😟|My water broke at 31 weeks.",s:"Which actions are appropriate? Select all that apply.",o:["Monitor temperature regularly","Avoid digital vaginal exams","Assess fluid color and odor","Monitor the fetal heart rate","Encourage tub baths for comfort","Insert a tampon to measure leaking"],r:"With the barrier gone, anything entering the vagina raises infection risk.",c:["Membranes ruptured","Bacteria ascend","Chorioamnionitis"],tip:"Ruptured membranes: nothing in the vagina."}]},
{f:3,t:"Stages of Labor",e:"🚼",ref:"ATI Maternal Newborn Ch 11 & 14 · Ricci Ch 13",
kp:["True labor: contractions strengthen with walking and the cervix changes","Stage 1: latent, active, transition. Stage 2: complete dilation to birth. Stage 3: placenta. Stage 4: recovery","Transition: nausea, shaking, urge to push, 'I can't do this'","Membranes rupture: check the fetal heart rate FIRST (cord prolapse)","Placental separation: gush of blood, cord lengthens, firm globular uterus","Station 0 = ischial spines"],
v:[["😀","Latent","Chatty and excited"],["😤","Active","Serious, focused"],["😫","Transition","Shaky, nauseated, 'I can't'"],["💦","Water breaks","Fetal heart rate first"]],
q:[
{p:"Zara, 27|😳|I think my water just broke!",s:"Zara's membranes rupture spontaneously. What is the first action?",o:["Assess the fetal heart rate","Test the fluid with nitrazine paper","Change the wet linens","Document the time and color"],r:"The cord can wash down with the fluid. A drop in heart rate is the first clue to cord compression.",c:["Fluid gushes","Cord slips below the baby","Compression and hypoxia"],tip:"Rupture = heart rate first, every time."},
{y:"matrix",cols:["Latent","Active","Transition"],rows:[["Dilated 2 cm, talkative and excited",0],["Dilated 6 cm, serious, focused on breathing",1],["Dilated 9 cm, nauseated, shaking, 'I can't do this'",2]],p:"Three laboring clients|😮‍💨|How far along am I?",s:"Match each client to the phase of first-stage labor.",r:"Behavior tracks dilation. Loss of control signals transition.",c:["Cervix nears 10 cm","Intense contractions","Loss of control, urge to push"],tip:"Behavior clues are tested as often as numbers."},
{y:"sata",n:4,p:"Zara, 27|😌|Baby is here! What now?",s:"Which signs show the placenta is separating? Select all that apply.",o:["A sudden gush of blood","The cord lengthens","The uterus becomes firm and globular","The fundus rises in the abdomen","The cord retracts into the vagina","The uterus becomes soft and boggy"],r:"As the placenta detaches and descends, the cord advances and the uterus contracts into a ball.",c:["Uterus contracts","Placenta shears off","Gush and lengthening cord"],tip:"Gush, lengthen, globe."},
{p:"Pam, 24|🤔|Is this the real thing?",s:"Which finding indicates true labor?",o:["Contractions grow stronger with walking and the cervix changes","Contractions fade after a warm shower and rest","Pain stays in the lower abdomen and groin","Contractions are irregular with no cervical change"],r:"Cervical change is what defines true labor.",c:["Regular contractions","Cervix effaces and dilates","True labor"],tip:"No cervical change = not labor."}]},
{f:3,t:"Pain Management & Epidurals",e:"💉",ref:"ATI Maternal Newborn Ch 12 (Pain Management) · Ricci Ch 14",
kp:["Epidural: IV fluid bolus before; hypotension is the most common problem","Hypotension after epidural: side-lying, IV fluids, oxygen, vasopressor","Check platelets before an epidural","Opioids: can depress newborn breathing if given close to birth; naloxone available","Spinal headache: worse upright, better flat; blood patch","Sacral counterpressure for back labor"],
v:[["⬇️","Epidural","Vessels dilate, BP drops"],["💧","Before","Fluid bolus + platelet count"],["🤕","Spinal headache","Worse sitting up: blood patch"],["😴","Opioids","Sleepy baby: naloxone"]],
q:[
{p:"Zara, 27|😵|I feel faint.",s:"Ten minutes after her epidural, Zara's BP is 82/46 and late decelerations appear. What is the first action?",o:["Turn her to her side and increase IV fluids","Raise the head of the bed fully","Prepare for a blood patch","Document and recheck in 15 minutes"],r:"The block dilates vessels. Side-lying and fluids restore return to the heart and the placenta.",c:["Sympathetic block","Vasodilation, BP falls","Less placental flow: late decelerations"],tip:"Epidural + low BP = side and fluids."},
{p:"Zara, 27|🙂|I want the epidural.",s:"Which lab is the priority before epidural placement?",o:["Platelet count","White blood cell count","Blood glucose","Hemoglobin A1c"],r:"Low platelets raise the risk of an epidural hematoma that can compress the spinal cord.",c:["Low platelets","Bleeding in epidural space","Cord compression"],tip:"Needle near the spine = check clotting."},
{p:"Hana, 30|🤕|My head pounds when I sit up.",s:"After spinal anesthesia, Hana's headache eases when lying flat. What does the nurse anticipate?",o:["An epidural blood patch","A magnesium sulfate bolus","A head CT for stroke","Walking to relieve pressure"],r:"Spinal fluid leaks through the puncture hole. A patch of her own blood seals it.",c:["Dural puncture","Spinal fluid leaks","Positional headache"],tip:"Positional headache = spinal fluid leak."},
{y:"sata",n:4,p:"Hana, 30|😮‍💨|Can I have something for the pain?",s:"An IV opioid is given in active labor. Which actions are appropriate? Select all that apply.",o:["Keep naloxone available","Monitor maternal respirations","Keep side rails up and assist her out of bed","Monitor the fetal heart rate","Give it right at crowning for best effect","Encourage her to walk alone"],r:"Opioids cross the placenta. Given just before birth, the newborn may not breathe well.",c:["Opioid crosses placenta","Newborn CNS depressed","Respiratory depression"],tip:"Timing of the dose is the trap."}]},
{f:3,t:"Fetal Heart Rate Monitoring",e:"📟",x:"fhr",ref:"ATI Maternal Newborn Ch 13 (Fetal Assessment During Labor) · Ricci Ch 14",
kp:["Baseline 110-160/min; moderate variability (6-25 beats) is the best sign of oxygenation","VEAL CHOP: Variable-Cord, Early-Head, Accelerations-Okay, Late-Placenta","Early: mirrors the contraction; no action","Late: starts after the peak, returns after the contraction ends; placenta problem","Variable: sudden V or W shape; cord compression; reposition first","Late or prolonged decelerations: side-lying, stop oxytocin, IV bolus, oxygen, notify"],
v:[["V→C","Variable","Cord compression: reposition"],["E→H","Early","Head compression: watch"],["A→O","Accelerations","Okay!"],["L→P","Late","Placental insufficiency: act"]],
q:[
{y:"matrix",cols:["Cord compression","Head compression","Okay (oxygenated)","Placental insufficiency"],rows:[["Variable decelerations",0],["Early decelerations",1],["Accelerations",2],["Late decelerations",3]],p:"Student nurse|🤓|VEAL CHOP time.",s:"Match each pattern to its cause.",r:"VEAL CHOP links each pattern to its cause.",c:["Pattern","Cause","Action"],tip:"Write VEAL CHOP on your scratch paper first."},
{p:"Zara, 27|😟|Why are you staring at the monitor?",s:"The heart rate dips gradually, with the lowest point after the contraction peak. What is the cause?",o:["Uteroplacental insufficiency","Fetal head compression","Umbilical cord compression","A normal sympathetic response"],r:"Late timing means the fetus runs short of oxygen during the contraction and recovers slowly.",c:["Contraction reduces placental flow","Fetal oxygen falls","Delayed drop in heart rate"],tip:"Late = late to start, late to recover."},
{p:"Zara, 27|😬|It beeped again.",s:"Repeated abrupt V-shaped decelerations appear after membranes rupture. What is the first action?",o:["Reposition the client","Prepare for amnioinfusion","Give terbutaline","Increase the oxytocin rate"],r:"Changing position can lift the baby off the cord. Amnioinfusion comes later if repositioning fails.",c:["Less fluid cushion","Cord squeezed","Sudden heart rate drop"],tip:"Variable = move the mother."},
{y:"sata",n:4,p:"Zara, 27|🙂|Tell me something good.",s:"Which findings are reassuring? Select all that apply.",o:["Baseline 140/min","Moderate variability","Accelerations with fetal movement","Early decelerations","Absent variability with late decelerations","Baseline 172/min for 15 minutes"],r:"Absent variability with late decelerations is the most ominous combination.",c:["Good oxygenation","Intact nervous system","Variability and accelerations"],tip:"Variability is the single best indicator."}]},
{f:3,t:"Oxytocin",e:"💧",med:1,ref:"ATI Maternal Newborn Ch 15 (Therapeutic Procedures) · Ricci Ch 21",
kp:["Always piggybacked into the main line, on a pump","Start low and increase slowly","Tachysystole: more than 5 contractions in 10 minutes, lasting over 90 seconds, or under 60 seconds of rest","Tachysystole or non-reassuring heart rate: stop oxytocin, side-lying, IV fluids, oxygen by mask, notify","Antidiuretic effect: water intoxication","Do not use with previa, cord prolapse, transverse lie or a prior classical incision"],
v:[["🔌","Pump","Piggyback, closest port"],["⏱️","Too many","More than 5 in 10 = stop"],["🛑","Stop first","Then side, fluids, oxygen, call"],["💦","Water","Headache, confusion: water intoxication"]],
q:[
{y:"calc",a:2,u:"mL/hr",p:"Pam, 24|🙂|They are going to help my labor along.",s:"Prescribed: oxytocin 2 milliunits/min. Available: 30 units in 500 mL. What is the pump rate?",r:"30 units = 30,000 milliunits in 500 mL = 60 milliunits/mL. 2 x 60 min = 120 milliunits/hr. 120 / 60 = 2 mL/hr.",c:["Units to milliunits","Per minute to per hour","mL/hr"],tip:"With 30 units in 500 mL, milliunits/min equals mL/hr."},
{y:"calc",a:10,u:"milliunits/min",p:"Pam, 24|😤|These are getting strong.",s:"Oxytocin 30 units in 500 mL is running at 10 mL/hr. How many milliunits/min is Pam receiving?",r:"10 mL x 60 milliunits/mL = 600 milliunits/hr. 600 / 60 = 10 milliunits/min.",c:["mL/hr","x concentration","/ 60"],tip:"Check the bag concentration every time."},
{y:"order",o:["Stop the oxytocin infusion","Turn the client to a side-lying position","Increase the main IV fluid rate","Give oxygen by face mask","Notify the provider"],p:"Pam, 24|😖|They will not stop coming!",s:"Pam has 7 contractions in 10 minutes with late decelerations. Place the actions in order.",r:"Remove the cause, then improve placental blood flow and oxygen, then call.",c:["Too many contractions","No rest for placental refill","Fetal hypoxia"],tip:"Oxytocin + trouble = turn it off first."},
{y:"sata",n:4,p:"Pam, 24|😫|No break at all!",s:"Which findings mean oxytocin should be stopped? Select all that apply.",o:["6 contractions in 10 minutes","Contractions lasting 120 seconds","Less than 60 seconds between contractions","Late decelerations","Contractions every 3 minutes lasting 60 seconds","Heart rate 135/min with moderate variability"],r:"The placenta refills only between contractions. No rest means no oxygen.",c:["Tachysystole","Placenta cannot refill","Late decelerations"],tip:"Every 2-3 minutes lasting about a minute is the goal."},
{p:"Charge nurse|🧐|One of these orders is wrong.",s:"For which client should the nurse question an oxytocin order?",o:["A client with a prior classical uterine incision","A client at 41 weeks with a favorable cervix","A client with ruptured membranes and no labor","A client with weak, infrequent contractions"],r:"A vertical scar in the upper uterus can rupture under strong contractions.",c:["Classical scar","Strong contractions stress it","Uterine rupture"],tip:"Classical incision = repeat cesarean."}]},
{f:3,t:"Labor Emergencies",e:"🚑",ref:"ATI Maternal Newborn Ch 16 (Complications Related to the Labor Process) · Ricci Ch 21",
kp:["Prolapsed cord: call for help, lift the presenting part off the cord with a gloved hand, knee-chest or Trendelenburg, oxygen, emergency cesarean","Shoulder dystocia (turtle sign): McRoberts + SUPRAPUBIC pressure; never fundal pressure","Uterine rupture: tearing pain, contractions stop, baby rises, heart rate falls","Amniotic fluid embolism: sudden breathlessness, low BP, then DIC","Meconium-stained fluid: have newborn resuscitation ready"],
v:[["🪢","Cord prolapse","Hand in, hips up, call"],["🐢","Turtle sign","Knees to chest + suprapubic pressure"],["💥","Rupture","Tearing pain, contractions stop"],["🫁","Fluid embolism","Sudden collapse, then bleeding"]],
q:[
{y:"order",o:["Call for help while staying with the client","With a gloved hand, lift the presenting part off the cord","Position her knee-chest or in Trendelenburg","Give oxygen by face mask","Prepare for emergency cesarean birth"],p:"Zara, 27|😱|I feel something between my legs!",s:"A loop of cord is visible at the vagina. Place the actions in order.",r:"Relieving pressure on the cord restores blood flow until delivery. Never push the cord back in.",c:["Cord below the baby","Compressed with each contraction","Fetal hypoxia in minutes"],tip:"Your hand stays in until the baby is out."},
{p:"Pam, 24|😫|Why is the baby stuck?",s:"The head delivers and then pulls back against the perineum. What does the nurse do?",o:["Flex her thighs onto her abdomen and apply suprapubic pressure","Apply firm fundal pressure with the next push","Pull firmly downward on the baby's head","Have her push harder between contractions"],r:"McRoberts widens the pelvic outlet; suprapubic pressure frees the shoulder. Fundal pressure wedges it tighter.",c:["Shoulder caught behind pubic bone","Fundal pressure impacts it more","Nerve injury, hypoxia, rupture"],tip:"SUPRApubic, never fundal."},
{p:"Dee, 34|😨|Something just ripped inside me!",s:"Dee is attempting a vaginal birth after cesarean. Sudden tearing pain, contractions stop, heart rate 70/min, station moves from +1 to -2. What does the nurse suspect?",o:["Uterine rupture","Placental abruption","Amniotic fluid embolism","Cord prolapse"],r:"Loss of station and loss of contractions are the unique cues of rupture.",c:["Scar gives way","Baby moves into abdomen","Fetal bradycardia, maternal bleeding"],tip:"Contractions STOP = rupture. Board-like = abruption."},
{y:"bow",bt:{c:["Amniotic fluid embolism","Eclampsia","Spinal headache"],a:["Give high-flow oxygen and call the rapid response team","Prepare for CPR and blood products","Give a magnesium sulfate bolus","Sit her upright and observe"],p:["Oxygen saturation and heart rhythm","Clotting studies for DIC","Deep tendon reflexes","Urine protein"]},p:"Dee, 34|😵|I can't... breathe...",s:"Just after her membranes rupture, Dee is suddenly breathless and blue, BP 70/40, then oozes blood from her IV site. Complete the bowtie.",r:"Fluid entering her circulation causes sudden heart-lung collapse followed by DIC.",c:["Fluid enters maternal blood","Anaphylactic-type collapse","Arrest and DIC"],tip:"Sudden collapse + bleeding around birth = fluid embolism."}]},
{f:3,t:"Cesarean & Assisted Birth",e:"🔪",ref:"ATI Maternal Newborn Ch 15 (Therapeutic Procedures) · Ricci Ch 21",
kp:["Before cesarean: consent, catheter, antacid, antibiotic, wedge under the RIGHT hip","After: still check fundus and lochia; splint the incision; early walking","Vaginal birth after cesarean: only with a low transverse scar; never classical","Vacuum: cephalohematoma, scalp swelling. Forceps: facial bruising, facial nerve palsy","Amniotomy: heart rate before and after"],
v:[["📐","Wedge","Right hip up, uterus off the vena cava"],["➖","Low transverse","Trial of labor possible"],["⬆️","Classical","Always repeat cesarean"],["🧲","Vacuum vs forceps","Scalp vs face"]],
q:[
{p:"Dee, 34|😬|It is cold in here.",s:"How does the nurse position Dee on the operating table?",o:["With a wedge under her right hip","Flat on her back with arms at her sides","Head down with her legs flexed","On her right side with a pillow behind"],r:"Tilting the uterus to the left keeps it off the vena cava and aorta.",c:["Flat supine","Vessels compressed","Low BP, less placental flow"],tip:"Wedge RIGHT, tilt LEFT."},
{p:"Dee, 34|🤔|Can I try a vaginal birth next time?",s:"Which previous incision rules out a trial of labor?",o:["Classical vertical uterine incision","Low transverse uterine incision","Low horizontal skin incision","Any previous cesarean at all"],r:"The upper uterus contracts hardest, so a vertical scar there is most likely to rupture.",c:["Scar in the contracting segment","High tension in labor","Rupture"],tip:"It is the UTERINE scar that matters, not the skin."},
{y:"sata",n:4,p:"Dee, 34|😣|It hurts to cough.",s:"Dee is one day after cesarean birth. Which actions are appropriate? Select all that apply.",o:["Splint the incision when coughing","Help her walk early","Assess fundus and lochia","Check the incision for redness and drainage","Skip fundal checks to protect the incision","Keep her on bed rest for 48 hours"],r:"She can still hemorrhage, and immobility raises clot risk.",c:["Surgery + pregnancy clotting","Immobility slows blood","DVT"],tip:"Cesarean clients still get fundal checks."},
{y:"matrix",cols:["Vacuum","Forceps"],rows:[["Cephalohematoma",0],["Facial nerve palsy",1],["Round swelling where the cup sat",0],["Bruise marks on the cheeks",1]],p:"Baby Dee|👶|(a little bruised)",s:"Match each newborn finding to the device.",r:"The device's contact point tells you where the injury will be.",c:["Device pressure","Tissue trauma","More bilirubin from bruising"],tip:"Bruising raises jaundice risk."}]},
{f:4,t:"Postpartum Assessment",e:"🤱",ref:"ATI Maternal Newborn Ch 17 & 19 · Ricci Ch 15 & 16",
kp:["BUBBLE-HE: Breasts, Uterus, Bowel, Bladder, Lochia, Episiotomy, Homans/legs, Emotions","Fundus: firm, midline, at the umbilicus, drops about 1 cm a day","Boggy: massage. Firm but high and off to the side: full bladder, have her void","Lochia: rubra (red, days 1-3), serosa (pink-brown, days 4-10), alba (white-yellow, after day 10)","Report: pad soaked in 15 minutes, large clots, foul odor","Normal: white cells up to 20-25,000, slow pulse, sweating, large urine output","Rubella non-immune: vaccinate before discharge, no pregnancy for 28 days"],
v:[["✊","Boggy","Massage first"],["➡️","High and to the right","Bladder is full: void"],["🔴","Rubra","Red, days 1-3"],["🩷","Serosa → Alba","Pink days 4-10, then white"]],
q:[
{p:"Chloe, 28|😕|I have not peed since the delivery.",s:"Two hours after vaginal birth, Chloe's fundus is firm, 2 cm above the umbilicus and displaced to the right. What is the first action?",o:["Help her empty her bladder","Massage the fundus vigorously","Give methylergonovine","Increase the oxytocin rate"],r:"A full bladder pushes the uterus up and aside and keeps it from contracting well.",c:["Full bladder","Uterus displaced, cannot clamp down","Atony and bleeding"],tip:"Displaced = bladder."},
{p:"Chloe, 28|😟|I feel a gush.",s:"Later, Chloe's fundus is boggy at the midline with heavy lochia. What is the first action?",o:["Massage the fundus until firm","Give methylergonovine IM","Call the provider","Insert an indwelling catheter"],r:"Massage stimulates the muscle to contract and clamp the open vessels. It is the fastest independent action.",c:["Uterine atony","Vessels at placental site stay open","Hemorrhage"],tip:"Boggy = massage."},
{y:"matrix",cols:["Rubra","Serosa","Alba"],rows:[["Dark red with small clots, day 2",0],["Pinkish brown, day 6",1],["Yellow-white, day 14",2]],p:"Chloe, 28|🤔|Is this bleeding normal?",s:"Match each description to the type of lochia.",r:"Going back to bright red after serosa suggests overactivity or late hemorrhage.",c:["Site heals","Less blood, more white cells","Red to pink to white"],tip:"Red, pink, white: like a fading flag."},
{y:"matrix",cols:["Expected","Report"],rows:[["White cells 22,000 on day 1",0],["Pad soaked in 15 minutes",1],["Pulse 54/min",0],["Night sweats and large urine output",0],["Temperature 38.6 C on day 3",1],["Foul-smelling lochia",1]],p:"Chloe, 28|🙂|How am I doing?",s:"Classify each postpartum finding.",r:"The body sheds pregnancy fluid by sweating and urinating. A fever after the first 24 hours suggests infection.",c:["Extra fluid mobilized","Kidneys and skin excrete it","Diuresis and sweating"],tip:"High white count alone is not infection after birth."}]},

q:[
{y:"matrix",cols:["Uterine atony","Laceration","Hematoma"],rows:[["Boggy uterus, heavy bleeding with clots",0],["Firm fundus, steady bright red trickle",1],["Firm fundus, severe rectal pressure, bulging bluish mass",2]],p:"Three clients|😨|Something is wrong.",s:"Match each set of findings to the cause of bleeding.",r:"Check the fundus first: if it is firm, look elsewhere for the source.",c:["Firm fundus","Tone is not the problem","Look for trauma"],tip:"Firm + bleeding = tear. Firm + pain = hematoma."},
